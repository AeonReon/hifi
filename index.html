<script>
'use strict';

// ============================================================
// BUILD VERSION (bumped on every deploy)
// ============================================================
const BUILD = 'v27';
document.getElementById('build-pill').textContent = BUILD;

// ============================================================
// THEME (light / dark) — light is default, choice persists.
// ============================================================
(function initTheme() {
    const saved = localStorage.getItem('hifi_theme'); // 'dark' | 'light' | null
    const theme = saved === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#103464' : '#F7F4EE');
})();
document.getElementById('theme-toggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('hifi_theme', next);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next === 'dark' ? '#103464' : '#F7F4EE');
});

// Poll sw.js to detect new deploys; show banner when it changes.
async function checkForNewBuild(initial) {
    try {
        const r = await fetch('sw.js?_=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return null;
        const txt = await r.text();
        const m = txt.match(/CACHE\s*=\s*['"]([^'"]+)['"]/);
        return m ? m[1] : null;
    } catch (_) { return null; }
}
(async () => {
    const initial = await checkForNewBuild(true);
    if (!initial) return;
    setInterval(async () => {
        const cur = await checkForNewBuild(false);
        if (cur && cur !== initial) {
            document.getElementById('update-banner').classList.add('show');
        }
    }, 60000);
})();

// ============================================================
// INDEXEDDB LAYER
// ============================================================
const DB_NAME = 'hifi';
const DB_VERSION = 2;
let _db = null;

function openDB() {
    return new Promise((resolve, reject) => {
        if (_db) return resolve(_db);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = () => reject(req.error);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('tracks')) {
                const s = db.createObjectStore('tracks', { keyPath: 'id' });
                s.createIndex('addedAt', 'addedAt');
                s.createIndex('album', 'album');
            }
            if (!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
            // Shelf downloads land here piece by piece until the file is whole.
            if (!db.objectStoreNames.contains('parts')) db.createObjectStore('parts', { keyPath: 'key' });
        };
        req.onsuccess = () => {
            _db = req.result;
            // Let a newer copy of Hifi in another tab upgrade the database.
            _db.onversionchange = () => { _db.close(); _db = null; };
            resolve(_db);
        };
    });
}

async function dbPut(store, value) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
    });
}
async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
    });
}
async function dbAll(store) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => rej(req.error);
    });
}
async function dbDelete(store, key) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
    });
}

// ============================================================
// STATE
// ============================================================
const state = {
    tracks: [],
    playlists: [],
    audiobookIds: new Set(),
    // albumKey -> 'song' | 'album' | 'audiobook'. Missing entries fall back to
    // defaultCategoryForKey() — solo (unknown-album, single-file) tracks default
    // to 'song' so loose files don't pile up in Albums; everything else 'album'.
    categoryMap: new Map(),
    settings: { volume: 0.8, speed: 1, repeat: 'off', shuffle: false },
    currentView: { kind: 'home', id: null },
    viewHistory: [],
    queue: [],
    queueIdx: -1,
    currentTrack: null,
    isPlaying: false,
    sleepTimer: null,
    sleepRemaining: 0,
    searchQuery: '',
    // Books: where you are, which you've finished, and each one's own speed /
    // voice boost. Keyed by albumKey, like everything else about a book.
    positions: new Map(),      // album key -> { trackId, position, ts }

function isAudioFile(file) {

function basenameNoExt(name) { return (name || '').replace(/\.[^.]+$/, ''); }

// Parse LRC ([mm:ss.xx]text) or SRT/VTT into an array of {time, text}, sorted.
function parseLyrics(text, filename) {
    const ext = (filename || '').toLowerCase().match(/\.([a-z0-9]+)$/);
    const isLrc = ext && ext[1] === 'lrc';
    const out = [];
    if (isLrc) {
        const lines = text.split(/\r?\n/);
        for (const line of lines) {
            const m = line.match(/^((?:\[\d{1,2}:\d{2}(?:[.:]\d{1,3})?\])+)(.*)$/);
            if (!m) continue;
            const stamps = m[1].match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g) || [];
            const body = m[2].trim();
            for (const s of stamps) {
                const mm = s.match(/\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/);
                if (!mm) continue;
                const mins = parseInt(mm[1], 10);
                const secs = parseInt(mm[2], 10);
                const fracStr = mm[3] || '0';
                const frac = parseInt(fracStr.padEnd(3, '0').slice(0, 3), 10) / 1000;
                const t = mins * 60 + secs + frac;
                out.push({ time: t, text: body });
            }
        }
    } else {
        // SRT / VTT — share the same timestamp shape (HH:MM:SS,mmm or HH:MM:SS.mmm)
        const blocks = text.replace(/\r/g, '').split(/\n\n+/);
        for (const blk of blocks) {
            const lines = blk.split('\n').filter(Boolean);
            if (lines.length < 2) continue;
            const tIdx = /-->/.test(lines[0]) ? 0 : 1;
            const tline = lines[tIdx] || '';
            const m = tline.match(/(\d{1,2}):(\d{2}):(\d{2})[.,](\d{1,3})\s*-->/);
            if (!m) continue;
            const t = parseInt(m[1], 10) * 3600 + parseInt(m[2], 10) * 60 + parseInt(m[3], 10) + parseInt(m[4], 10) / 1000;
            const body = lines.slice(tIdx + 1).join(' ').replace(/<[^>]+>/g, '').trim();
            if (body) out.push({ time: t, text: body });
        }
    }
    out.sort((a, b) => a.time - b.time);
    return out;
}

// Infer a working MIME type from a file. Browsers often leave file.type empty
// for .m4b and some other extensions — an empty-type Blob can fail to decode.
function inferMimeType(file) {
    if (file.type && file.type !== '') return file.type;
    const name = (file.name || '').toLowerCase();
    const m = name.match(/\.([a-z0-9]+)$/);
    const ext = m ? m[1] : '';
    return {
        mp3: 'audio/mpeg', mp2: 'audio/mpeg', mpga: 'audio/mpeg',
        m4a: 'audio/mp4', m4b: 'audio/mp4', mp4: 'audio/mp4',
        aac: 'audio/aac',
        ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg',
        wav: 'audio/wav', wave: 'audio/wav',
        flac: 'audio/flac',
        weba: 'audio/webm', webm: 'audio/webm',
        wma: 'audio/x-ms-wma',
        aif: 'audio/aiff', aiff: 'audio/aiff', aifc: 'audio/aiff',
        ape: 'audio/x-ape',
        amr: 'audio/amr',

// Test whether the browser will play a given file. Returns 'probably', 'maybe', or '' (no).
function canBrowserPlay(file) {

        const mt = inferMimeType(file);
        const r = probe.canPlayType(mt);
        if (r) return r;
        // Try with a codec hint — some browsers need it for AAC inside mp4
        const ext = ((file.name || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '';
        const codecHints = { m4a: 'mp4a.40.2', m4b: 'mp4a.40.2', aac: 'mp4a.40.2', flac: 'flac', opus: 'opus' };
        if (codecHints[ext.toLowerCase()]) {
            return probe.canPlayType(`${mt}; codecs="${codecHints[ext.toLowerCase()]}"`);
        }
        return '';
    } catch (_) { return ''; }
}

// Return a Blob with a guaranteed, correct MIME type so createObjectURL
// produces a URL the <audio> element can decode. Older imports may have a
// wrong stored mimeType (e.g. .m4b incorrectly tagged audio/mpeg), so we
// always re-infer from the actual File.
function playableBlob(track) {
    const desired = inferMimeType(track.file || {}) || track.mimeType || 'audio/mpeg';
    if (track.file && track.file.type === desired) return track.file;
    return new Blob([track.file], { type: desired });
}

// ============================================================
// MP4 CHAPTER PARSER
// Supports:
//   - moov anywhere in the file (start, middle, or end)
//   - Nero `chpl` atoms (older / Audible-style m4b)
//   - QuickTime chapter reference tracks (`tref/chap` → text track)
// ============================================================
function readBoxType(dv, offset) {
    return String.fromCharCode(dv.getUint8(offset), dv.getUint8(offset+1), dv.getUint8(offset+2), dv.getUint8(offset+3));
}
function findAllBoxes(dv, type) {
    const out = [];
    let pos = 0;
    while (pos + 8 <= dv.byteLength) {
        let size = dv.getUint32(pos);
        const t = readBoxType(dv, pos + 4);
        let dataStart = pos + 8;
        if (size === 1) {
            if (pos + 16 > dv.byteLength) break;
            size = Number(dv.getBigUint64(pos + 8));
            dataStart = pos + 16;
        } else if (size === 0) {
            size = dv.byteLength - pos;
        }
        if (size < 8 || pos + size > dv.byteLength) break;
        if (t === type) out.push(new DataView(dv.buffer, dv.byteOffset + dataStart, pos + size - dataStart));
        pos += size;
    }
    return out;
}
function findBox(dv, type) {
    const all = findAllBoxes(dv, type);
    return all.length ? all[0] : null;
}
function findPath(dv, ...types) {
    let cur = dv;
    for (const t of types) {
        cur = findBox(cur, t);
        if (!cur) return null;
    }
    return cur;
}

function parseChplBox(dv) {
    try {
        let p = 0;
        const version = dv.getUint8(p); p += 1;
        p += 3; // flags
        if (version >= 1) p += 4; // reserved
        const count = dv.getUint8(p); p += 1;
        const decoder = new TextDecoder('utf-8');
        const chapters = [];
        for (let i = 0; i < count && p + 9 <= dv.byteLength; i++) {
            const ts100ns = Number(dv.getBigUint64(p)); p += 8;
            const nameLen = dv.getUint8(p); p += 1;
            if (p + nameLen > dv.byteLength) break;
            const name = decoder.decode(new Uint8Array(dv.buffer, dv.byteOffset + p, nameLen));
            p += nameLen;
            chapters.push({ time: ts100ns / 1e7, title: name });
        }
        return chapters.length ? chapters : null;
    } catch (_) { return null; }
}

// Walk top-level atoms in the whole file (not just first 16MB) to find moov.
async function findMoovDataView(file) {
    let pos = 0;
    const fileSize = file.size;
    while (pos + 8 < fileSize) {
        const hdr = new DataView(await file.slice(pos, pos + 16).arrayBuffer());
        let size = hdr.getUint32(0);
        const type = readBoxType(hdr, 4);
        let dataStart = pos + 8;
        if (size === 1) {
            size = Number(hdr.getBigUint64(8));
            dataStart = pos + 16;
        } else if (size === 0) {
            size = fileSize - pos;
        }
        if (size <= 0) return null;
        if (type === 'moov') {
            return new DataView(await file.slice(dataStart, pos + size).arrayBuffer());
        }
        pos += size;
    }
    return null;
}

// Parse stts (sample-to-time) — list of (count, delta) pairs giving sample durations.
function parseStts(dv) {
    if (!dv) return null;
    const entries = [];
    const count = dv.getUint32(4);
    let p = 8;
    for (let i = 0; i < count && p + 8 <= dv.byteLength; i++) {
        entries.push({ count: dv.getUint32(p), delta: dv.getUint32(p + 4) });
        p += 8;
    }
    return entries;
}

    if (!dv) return null;
    const sampleSize = dv.getUint32(4);
    const count = dv.getUint32(8);
    if (sampleSize !== 0) return new Array(count).fill(sampleSize);
    const out = [];
    let p = 12;
    for (let i = 0; i < count && p + 4 <= dv.byteLength; i++) {
        out.push(dv.getUint32(p));
        p += 4;
    }
    return out;
}
function parseStsc(dv) {
    if (!dv) return null;
    const count = dv.getUint32(4);
    const entries = [];
    let p = 8;
    for (let i = 0; i < count && p + 12 <= dv.byteLength; i++) {
        entries.push({ firstChunk: dv.getUint32(p), samplesPerChunk: dv.getUint32(p + 4), descIdx: dv.getUint32(p + 8) });
        p += 12;
    }
    return entries;
}
function parseStco(dv, is64) {
    if (!dv) return null;
    const count = dv.getUint32(4);
    const out = [];
    let p = 8;
    const step = is64 ? 8 : 4;
    for (let i = 0; i < count && p + step <= dv.byteLength; i++) {
        out.push(is64 ? Number(dv.getBigUint64(p)) : dv.getUint32(p));
        p += step;
    }
    return out;
}
function readMdhdTimescale(dv) {
    const v = dv.getUint8(0);
    return dv.getUint32(v === 1 ? 20 : 12);
}
function readTrackId(tkhd) {
    const v = tkhd.getUint8(0);
    return tkhd.getUint32(v === 1 ? 20 : 12);
}

// Compute file offsets for every sample in a track from stsc + stco + stsz.
function computeSampleOffsets(stsc, stsz, chunkOffsets) {
    const offsets = new Array(stsz.length);
    let sampleIdx = 0;
    for (let chunkIdx = 0; chunkIdx < chunkOffsets.length; chunkIdx++) {
        // find stsc entry that covers this chunk
        let perChunk = 1;
        for (let k = stsc.length - 1; k >= 0; k--) {
            if (stsc[k].firstChunk - 1 <= chunkIdx) { perChunk = stsc[k].samplesPerChunk; break; }
        }
        let off = chunkOffsets[chunkIdx];
        for (let s = 0; s < perChunk && sampleIdx < stsz.length; s++) {
            offsets[sampleIdx] = off;
            off += stsz[sampleIdx];
            sampleIdx++;
        }
    }
    return offsets;
}

    const times = [];
    let t = 0;
    for (const e of stts) {
        for (let i = 0; i < e.count; i++) {
            times.push(t / timescale);
            t += e.delta;
        }
    }
    return times;
}

async function parseQtChapters(file, moov) {
    const traks = findAllBoxes(moov, 'trak');
    if (!traks.length) return null;

    // Find a trak that references chapters via tref→chap
    let chapterTrackIds = null;
    for (const trak of traks) {
        const tref = findBox(trak, 'tref');
        if (!tref) continue;
        const chap = findBox(tref, 'chap');
        if (!chap) continue;
        chapterTrackIds = [];
        for (let i = 0; i + 4 <= chap.byteLength; i += 4) chapterTrackIds.push(chap.getUint32(i));
        break;
    }
    if (!chapterTrackIds || !chapterTrackIds.length) return null;

    // Locate the chapter track
    let chapterTrak = null;
    for (const trak of traks) {
        const tkhd = findBox(trak, 'tkhd');
        if (!tkhd) continue;
        if (chapterTrackIds.includes(readTrackId(tkhd))) { chapterTrak = trak; break; }
    }
    if (!chapterTrak) return null;

    const mdhd = findPath(chapterTrak, 'mdia', 'mdhd');
    const timescale = mdhd ? readMdhdTimescale(mdhd) : 1000;
    const stbl = findPath(chapterTrak, 'mdia', 'minf', 'stbl');
    if (!stbl) return null;

    const stts = parseStts(findBox(stbl, 'stts'));
    const stsz = parseStsz(findBox(stbl, 'stsz'));
    const stsc = parseStsc(findBox(stbl, 'stsc'));
    const co64 = findBox(stbl, 'co64');
    const stco = co64 || findBox(stbl, 'stco');
    if (!stts || !stsz || !stsc || !stco) return null;
    const chunkOffsets = parseStco(stco, !!co64);
    const sampleOffsets = computeSampleOffsets(stsc, stsz, chunkOffsets);
    const sampleTimes = computeSampleTimes(stts, timescale);

    const decoder = new TextDecoder('utf-8');
    const chapters = [];
    for (let i = 0; i < sampleOffsets.length; i++) {
        const sz = stsz[i] || 0;
        if (sz < 2) continue;
        const buf = await file.slice(sampleOffsets[i], sampleOffsets[i] + sz).arrayBuffer();
        const dv = new DataView(buf);
        const len = dv.getUint16(0);
        const textBytes = new Uint8Array(buf, 2, Math.min(len, sz - 2));
        const title = decoder.decode(textBytes);
        chapters.push({ time: sampleTimes[i] || 0, title: title.trim() || ('Chapter ' + (i + 1)) });
    }
    return chapters.length ? chapters : null;
}

async function readMp4Chapters(file) {
    try {
        const moov = await findMoovDataView(file);
        if (!moov) return null;
        // 1. Try Nero chpl (most reliable when present)
        const chpl = findPath(moov, 'udta', 'chpl');
        if (chpl) {
            const c = parseChplBox(chpl);
            if (c && c.length > 1) return c;
        }
        // 2. Try QuickTime chapter reference track (most modern m4b)
        const qt = await parseQtChapters(file, moov);
        if (qt && qt.length > 1) return qt;
    } catch (e) {
        console.warn('chapter parse failed', e);
    }
    return null;
}

function hueFromString(s) {
    let h = 0;
    s = String(s || '?');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h % 360;
}
// Curated 12-pair gradient palette — hashed by seed so each unique title
// gets its own colour, instead of every "Unknown Album" looking identical.
const PLACEHOLDER_GRADIENTS = [
    ['#D9A02D', '#A8771A'], // gold
    ['#2D7AB8', '#1F5A8E'], // blue
    ['#2A9D8F', '#1E7268'], // teal
    ['#7C5CBF', '#5A4290'], // purple
    ['#E07A5F', '#B85A3F'], // coral
    ['#4C8C5D', '#356342'], // forest
    ['#C75C7F', '#9A4262'], // rose
    ['#D87E2A', '#A85E15'], // amber
    ['#5A6B8E', '#3D4A66'], // slate
    ['#9B4C8C', '#6E325E'], // plum
    ['#8B8A4A', '#65642F'], // olive
    ['#A04545', '#6E2828'], // maroon
];

function hashString(s) {
    let h = 0;
    s = String(s || '?');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
}

function isUnknownAlbum(name) {
    if (!name) return true;
    const n = String(name).toLowerCase().trim();
    return n === '' || n === 'unknown album' || n === 'unknown';
}

// First few meaningful words of a title, capped at ~28 chars / 5 words.
function deriveTitleName(title) {
    const cleaned = String(title || '').trim();
    if (!cleaned) return 'Untitled';
    const words = cleaned.split(/\s+/);
    let out = '';
    for (const w of words) {
        if (out && (out.length + 1 + w.length) > 28) break;
        out = out ? out + ' ' + w : w;
        if (out.split(/\s+/).length >= 5) break;
    }
    return out;
}

// Display name for an album — falls back to first track's derived title when unknown.
function displayAlbumName(album) {
    if (!album) return 'Unknown';
    if (!isUnknownAlbum(album.name)) return album.name;
    const t = album.tracks && album.tracks[0];
    return t ? deriveTitleName(t.title) : 'Unknown';
}

// Display value for a track's album (used in track-row meta + np subtitle).
function displayTrackAlbum(track) {
    if (!track) return '';
    if (!isUnknownAlbum(track.album)) return track.album;
    return deriveTitleName(track.title);
}

// Hash seed for placeholder art — unique per "thing" so each card gets a different colour.
function placeholderSeed(album) {
    if (!album) return '?';
    if (!isUnknownAlbum(album.name)) return album.name;
    const t = album.tracks && album.tracks[0];
    return (t && (t.title || t.id)) || album.key || 'Unknown';
}

// 1-3 char initials. "101 Power Thoughts" → "101"; "Power Thoughts" → "PT"; "Power" → "P".
function initialsFor(text) {
    const t = String(text || '').trim();
    if (!t) return '?';
    const words = t.split(/\s+/).filter(Boolean);
    const numMatch = words[0] && words[0].match(/^\d+/);
    if (numMatch) return numMatch[0].slice(0, 3);
    const letters = words.slice(0, 2).map(w => w[0].toUpperCase()).join('');
    return letters || t[0].toUpperCase();
}

function placeholderArt(text) {
    const seed = String(text || '').trim() || '?';
    const letters = initialsFor(seed);
    const h = hashString(seed);
    const [c1, c2] = PLACEHOLDER_GRADIENTS[h % PLACEHOLDER_GRADIENTS.length];
    const id = 'g_' + (h % 9973).toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    const fontSize = letters.length >= 3 ? 64 : letters.length === 2 ? 78 : 92;
    return `<svg class="art-placeholder" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${c1}"/>
            <stop offset="100%" stop-color="${c2}"/>
        </linearGradient></defs>
        <rect width="200" height="200" fill="url(#${id})"/>
        <text x="100" y="${100 + fontSize * 0.34}" text-anchor="middle" font-family="-apple-system,SF Pro Display,system-ui,sans-serif" font-size="${fontSize}" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="-2">${escapeHtml(letters)}</text>
    </svg>`;
}

// A streamed book shows the cover the mini painted for it.
function remoteCoverURL(track) {
    return track && track.remote && track.remote.cover ? shelfUrl(track.remote.cover) : null;
}

    const url = track && (artworkURL(track) || remoteCoverURL(track));
    if (url) return `<img src="${url}" alt="">`;
    if (!track) return placeholderArt('?');
    // Unknown-album tracks hash on their title so each gets a unique colour.
    const seed = isUnknownAlbum(track.album) ? (track.title || track.id) : track.album;
    return placeholderArt(seed);
}

    const cover = album.tracks.find(t => t.artwork);
    if (cover) return `<img src="${artworkURL(cover)}" alt="">`;
    return placeholderArt(placeholderSeed(album));
}

    const created = [];
    const all = Array.from(fileList);
    const files = all.filter(isAudioFile);
    const lyricFiles = all.filter(isLyricsFile);
    if (!files.length && !lyricFiles.length) { toast('No audio or lyrics files found'); return; }

    // Pair lyric files with audio files by basename — works whether the user
    // drags both at once (from a yt-grab download folder) or attaches lyrics
    // afterwards (single .lrc dropped to update an existing track).
    const lyricByBasename = {};
    for (const lf of lyricFiles) {
        try {
            const text = await lf.text();
            lyricByBasename[basenameNoExt(lf.name).toLowerCase()] = parseLyrics(text, lf.name);
        } catch (err) { console.error('Lyric parse error', lf.name, err); }
    }

    if (!files.length) {
        // Lyrics-only drop → attach to existing tracks by basename match.
        let attached = 0;
        for (const [base, lyrics] of Object.entries(lyricByBasename)) {
            if (!lyrics || !lyrics.length) continue;
            const match = state.tracks.find(t => basenameNoExt((t.file && t.file.name) || '').toLowerCase() === base);
            if (match) { match.lyrics = lyrics; await dbPut('tracks', match); attached++; }
        }
        toast(attached ? `Attached lyrics to ${attached} track${attached !== 1 ? 's' : ''}` : 'No matching song found for those lyrics');
        if (attached) render();
        return;
    }

    toast(`Importing ${files.length} file${files.length > 1 ? 's' : ''}...`);
    let added = 0;
    let unsupported = 0;
    let lyricsAttached = 0;

    for (const file of files) {
        try {
            const isMp4Family = /\.(m4a|m4b|mp4|aac)$/i.test(file.name || '');
            const [tags, duration, chapters] = await Promise.all([
                readTags(file),
                getDuration(file),
                isMp4Family ? readMp4Chapters(file) : Promise.resolve(null),
            ]);
            const artworkBlob = tagPictureToBlob(tags.picture);
            const isAudiobook = extra.kind === 'audiobook'
                || (tags.genre || '').toLowerCase().includes('audiobook')
                || (file.name || '').toLowerCase().endsWith('.m4b')
                || (chapters && chapters.length > 1);
            const canPlay = canBrowserPlay(file);
            if (!canPlay) unsupported++;
            const ext = ((file.name || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '';
            const lyrics = lyricByBasename[basenameNoExt(file.name).toLowerCase()] || null;
            if (lyrics && lyrics.length) lyricsAttached++;

            const track = {
                id: uid(),
                title: tags.title || file.name.replace(/\.[^.]+$/, ''),
                artist: tags.artist || 'Unknown Artist',
                album: tags.album || albumFallback || 'Unknown Album',
                albumArtist: tags.albumArtist || tags.artist || 'Unknown Artist',
                trackNum: parseInt(tags.track) || 0,
                duration: duration,
                mimeType: inferMimeType(file),
                ext: ext.toLowerCase(),
                playable: canPlay !== '',
                addedAt: Date.now(),
                kind: isAudiobook ? 'audiobook' : 'music',
                file: file,
                artwork: artworkBlob,
                chapters: chapters || (chaptersFallback && chaptersFallback.length > 1 ? chaptersFallback : null),
                bookmarks: [],
                lyrics: lyrics,
                ...extra,
            };

            await dbPut('tracks', track);
            state.tracks.push(track);
            created.push(track);
            if (isAudiobook) {
                state.audiobookIds.add(albumKey(track));
                state.categoryMap.set(albumKey(track), 'audiobook');
            }
            added++;
        } catch (err) {
            console.error('Import error', file.name, err);
        }
    }

    saveAudiobookFlags();
    saveCategoryMap();
    refreshSidebarCounts();
    render();
    const lyricsNote = lyricsAttached ? ` · lyrics on ${lyricsAttached}` : '';
    if (extra.shelfId) return created;          // the shelf says its own thing
    if (unsupported) {
        toast(`Added ${added}${lyricsNote} • ${unsupported} format${unsupported !== 1 ? 's' : ''} this browser cannot decode`);
    } else {
        toast(`Added ${added} track${added !== 1 ? 's' : ''}${lyricsNote}`);
    }
    return created;
}

// Any id in a queue is either a local track or a shelf track.
function findTrack(id) {
    return state.tracks.find(t => t.id === id) || state.shelf.objs.get(id) || null;
}

function albumKey(track) {
    // Something streamed off the shelf is its own "book", so where you got to
    // in one talk is never mistaken for where you got to in another.
    if (track.remote) return '__shelf__\t' + track.remote.id;
    // Unknown-album tracks each become their own pseudo-album so they get
    // unique cards/colours in the Albums view instead of all piling into one tile.
    if (isUnknownAlbum(track.album)) return '__solo__\t' + track.id;
    return (track.albumArtist || track.artist) + '\t' + track.album;
}

// Default 3-way category for an album group when the user hasn't overridden it.
function defaultCategoryForKey(key) {
    if (key && key.startsWith('__solo__\t')) return 'song';
    return 'album';
}

function albumCategory(key) {
    if (state.categoryMap.has(key)) return state.categoryMap.get(key);
    // Legacy: any key previously flagged as audiobook should resolve to 'audiobook'
    if (state.audiobookIds.has(key)) return 'audiobook';
    return defaultCategoryForKey(key);
}

async function setAlbumCategory(key, category) {
    if (!['song', 'album', 'audiobook'].includes(category)) return;
    state.categoryMap.set(key, category);
    if (category === 'audiobook') state.audiobookIds.add(key);
    else state.audiobookIds.delete(key);
    await Promise.all([saveCategoryMap(), saveAudiobookFlags()]);
}

async function saveAudiobookFlags() {
    await dbPut('meta', { key: 'audiobookAlbums', value: Array.from(state.audiobookIds), migratedSoloV1: true });
}

async function saveCategoryMap() {
    await dbPut('meta', { key: 'categoryMap', value: Array.from(state.categoryMap.entries()) });
}

// ============================================================
// LOAD
// ============================================================
async function loadAll() {
    state.tracks = await dbAll('tracks');
    state.playlists = await dbAll('playlists');
    const ab = await dbGet('meta', 'audiobookAlbums');
    state.audiobookIds = new Set(ab?.value || []);
    // Migrate audiobook flags for unknown-album tracks: old key was
    // "artist\x00Unknown Album"; new key is "__solo__\x00<trackId>".
    if (!ab?.migratedSoloV1) {
        const next = new Set();
        for (const k of state.audiobookIds) next.add(k);
        state.tracks.forEach(t => {
            if (!isUnknownAlbum(t.album)) return;
            const oldKey = (t.albumArtist || t.artist) + '\t' + t.album;
            if (state.audiobookIds.has(oldKey)) next.add(albumKey(t));
        });
        state.audiobookIds = next;
        await dbPut('meta', { key: 'audiobookAlbums', value: Array.from(next), migratedSoloV1: true });
    }
    // v16+: separator changed from \x00 to \t to avoid HTML attribute mangling.
    if (!ab?.migratedSepV2) {
        const next = new Set();
        for (const k of state.audiobookIds) next.add(k.replace(/\x00/g, '\t'));
        state.audiobookIds = next;
        const stored = await dbGet('meta', 'audiobookAlbums');
        await dbPut('meta', { ...(stored || {}), key: 'audiobookAlbums', value: Array.from(next), migratedSepV2: true });
    }
    // Load 3-way categoryMap (song/album/audiobook). Audiobook flags are
    // mirrored into it so legacy state still works.
    const cm = await dbGet('meta', 'categoryMap');
    state.categoryMap = new Map(cm?.value || []);
    let cmDirty = false;
    for (const k of state.audiobookIds) {
        if (state.categoryMap.get(k) !== 'audiobook') {
            state.categoryMap.set(k, 'audiobook');
            cmDirty = true;
        }
    }
    if (cmDirty) saveCategoryMap();
    const settings = await dbGet('meta', 'settings');
    if (settings?.value) Object.assign(state.settings, settings.value);
    await loadBooks();
    await loadDevice();
    await loadShelfAuth();
    if (state.shelf.token) loadShelf().catch(() => {});
    refreshPartials().catch(() => {});
    // Backfill chapters for tracks imported before chapter parsing existed
    backfillChapters().catch(() => {});
    audio.volume = state.settings.volume;
    audio.playbackRate = state.settings.speed;
    audio.preservesPitch = true;
    audio.mozPreservesPitch = true;
    audio.webkitPreservesPitch = true;
    if (state.settings.eq) {
        eq.on = !!state.settings.eq.on;
        Object.assign(eq.bands, state.settings.eq.bands || {});
        if (eq.on) { ensureEqGraph(); applyEqValues(); }
    }
    updateVolUI();
    updateSpeedUI();
    updateShuffleRepeatUI();
    updateEqUI();
    updateAbUI();
}

async function saveSettings() {
    state.settings.eq = { on: eq.on, bands: { ...eq.bands } };
    await dbPut('meta', { key: 'settings', value: state.settings });
}

async function backfillChapters() {
    let changed = false;
    for (const t of state.tracks) {
        if (t.chapters !== undefined && t.chapters !== null) continue;
        if (t.chapters === null) continue; // already checked, none found
        const name = (t.file && t.file.name) || '';
        if (!/\.(m4a|m4b|mp4)$/i.test(name) || !t.file) {
            t.chapters = null;
            await dbPut('tracks', t);
            continue;
        }
        try {
            const chapters = await readMp4Chapters(t.file);
            t.chapters = chapters || null;
            await dbPut('tracks', t);
            if (chapters && chapters.length > 1) changed = true;
        } catch (_) {
            t.chapters = null;
        }
    }
    if (changed) render();
}

// ============================================================
// BOOKS — where you are, what you've finished, per-book speed + voice
// ============================================================
async function loadBooks() {
    const meta = await dbAll('meta');
    state.positions = new Map();
    for (const m of meta) {
        if (m.key.startsWith('ab-pos-') && m.value && m.value.trackId) state.positions.set(m.key.slice(7), m.value);
        else if (m.key === 'finished') state.finished = new Set(m.value || []);
        else if (m.key === 'bookPrefs') state.bookPrefs = new Map(m.value || []);
        else if (m.key === 'pendingBooks') state.pendingBooks = m.value || [];
    }
}
const saveFinished = () => dbPut('meta', { key: 'finished', value: Array.from(state.finished) });
const saveBookPrefs = () => dbPut('meta', { key: 'bookPrefs', value: Array.from(state.bookPrefs.entries()) });

function savePosition(track, position) {
    const k = albumKey(track);
    const v = { trackId: track.id, position, ts: Date.now() };
    state.positions.set(k, v);
    dbPut('meta', { key: 'ab-pos-' + k, value: v });
    if (track.shelfId) scheduleBackup();
}
function clearPosition(k) {
    state.positions.delete(k);
    dbDelete('meta', 'ab-pos-' + k).catch(() => {});
}

// How far through a book you are, across all its parts.
function bookProgress(key) {
    const album = getAlbum(key);
    if (!album) return null;
    const total = album.tracks.reduce((a, t) => a + (t.duration || 0), 0);
    const p = state.positions.get(key);
    const idx = p ? album.tracks.findIndex(t => t.id === p.trackId) : -1;
    const done = idx < 0 ? 0
        : album.tracks.slice(0, idx).reduce((a, t) => a + (t.duration || 0), 0) + (p.position || 0);
    return { album, total, done, left: Math.max(0, total - done), frac: total ? Math.min(1, done / total) : 0, ts: p ? p.ts : 0 };
}
function fmtLeft(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    if (h && m) return `${h}h ${m}m left`;
    if (h) return `${h}h left`;
    return `${Math.max(1, m)}m left`;
}
// Books you've started and not finished, the most recent first.
function getContinueBooks() {
    return getAudiobooks()
        .filter(a => !state.finished.has(a.key))
        .map(a => bookProgress(a.key))
        .filter(p => p && p.done > 30 && p.left > 20)
        .sort((a, b) => b.ts - a.ts);
}
async function setFinished(key, on, quiet) {
    if (on) { state.finished.add(key); clearPosition(key); }
    else state.finished.delete(key);
    await saveFinished();
    scheduleBackup();
    if (!quiet) { toast(on ? 'Marked as finished ✓' : 'Marked as not finished'); render(); }
}
// Artwork overlays for a book card: a tick when finished, a bar while listening.
function bookBadges(key) {
    if (albumCategory(key) !== 'audiobook') return '';
    if (state.finished.has(key)) return '<span class="done-tick" title="Finished">✓</span>';
    const p = state.positions.has(key) ? bookProgress(key) : null;
    return p && p.done > 30 ? `<span class="book-bar"><i style="width:${(p.frac * 100).toFixed(1)}%"></i></span>` : '';
}

// Speed and voice boost belong to the book: Politics at 1.4×, a poem at 1×.
// Music keeps the one speed it always had. A book you haven't set yet starts
// at whatever speed you last chose for a book.
function prefsFor(track) { return track ? (state.bookPrefs.get(albumKey(track)) || {}) : {}; }
function isSpokenTrack(t) { return !!t && (isAudiobookTrack(t) || (t.remote && t.remote.kind === 'spoken')); }
function speedFor(track) {
    if (!isSpokenTrack(track)) return state.settings.speed;
    return prefsFor(track).speed || state.settings.bookSpeed || 1;
}

// ============================================================
// GROUPING / VIEWS
// ============================================================
function groupTracksByCategory(category) {
    const groups = {};
    for (const t of state.tracks) {
        const k = albumKey(t);
        if (albumCategory(k) !== category) continue;
        if (!groups[k]) groups[k] = { key: k, name: t.album, artist: t.albumArtist || t.artist, tracks: [] };
        groups[k].tracks.push(t);
    }
    return Object.values(groups).sort((a, b) => a.name.localeCompare(b.name));
}

function getAlbums() { return groupTracksByCategory('album'); }
function getAudiobooks() { return groupTracksByCategory('audiobook'); }
function getSongAlbums() { return groupTracksByCategory('song'); }

function getAlbum(key) {
    const tracks = state.tracks.filter(t => albumKey(t) === key);
    if (!tracks.length) return null;
    tracks.sort((a, b) => (a.trackNum || 0) - (b.trackNum || 0));
    return { key, name: tracks[0].album, artist: tracks[0].albumArtist || tracks[0].artist, tracks };
}

function applySearch(tracks) {
    if (!state.searchQuery) return tracks;
    const q = state.searchQuery.toLowerCase();
    return tracks.filter(t =>
        (t.title || '').toLowerCase().includes(q) ||
        (t.artist || '').toLowerCase().includes(q) ||
        (t.album || '').toLowerCase().includes(q));
}

// ============================================================
// RENDER
// ============================================================
function fmtTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    return `${m}:${String(sec).padStart(2, '0')}`;
}

const artworkCache = new Map();
function artworkURL(track) {
    if (!track.artwork) return null;
    if (artworkCache.has(track.id)) return artworkCache.get(track.id);
    const url = URL.createObjectURL(track.artwork);
    artworkCache.set(track.id, url);
    return url;
}

function renderEmptyLibrary() {
    return `
        <div class="empty">
            <div class="empty-icon">♪</div>
            <div class="empty-title">Your library is empty</div>
            <div class="empty-text">Drag audio files anywhere on this window, or tap Add Music. Albums and audiobooks are detected automatically from your files.</div>
            <button class="btn-primary" onclick="document.getElementById('file-input').click()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Choose Files
            </button>
        </div>`;
}

function renderAlbumsView(albums, title, kind) {
    if (!state.tracks.length) return renderEmptyLibrary();
    if (!albums.length) {
        return `
            <div class="view-header"><div><div class="view-title">${escapeHtml(title)}</div></div></div>
            <div class="empty">
                <div class="empty-icon">⌕</div>
                <div class="empty-title">Nothing here yet</div>
                <div class="empty-text">${kind === 'audiobooks' ? 'Files tagged as Audiobook (or .m4b files) appear here. You can also right-click any album to mark it as an audiobook.' : 'Add some music to fill out your library.'}</div>
            </div>`;
    }
    return `
        <div class="view-header">
            <div>
                <div class="view-title">${escapeHtml(title)}</div>
                <div class="view-subtitle">${albums.length} ${kind === 'audiobooks' ? 'audiobook' : 'album'}${albums.length !== 1 ? 's' : ''}</div>
            </div>
        </div>
        <div class="grid">
            ${albums.map(a => renderAlbumCard(a, kind)).join('')}
        </div>`;
}

function renderAlbumCard(album, kind) {
    const detailKind = kind === 'audiobooks' ? 'audiobook' : 'album';
    return `
        <div class="album-card" data-album-key="${escapeHtml(album.key)}" data-album-kind="${detailKind}" onclick="openDetail('${detailKind}', ${jsArg(album.key)})">
            <div class="album-art">
                ${albumArtHTML(album)}
                ${bookBadges(album.key)}
                ${renderPlayOverlay(album.key)}
            </div>
            <div class="album-name">${escapeHtml(displayAlbumName(album))}</div>
            <div class="album-artist">${escapeHtml(album.artist)}</div>
        </div>`;
}

function isAudiobookTrack(t) {
    return albumCategory(albumKey(t)) === 'audiobook' || t.kind === 'audiobook';
}

// Tracks belonging to album-groups categorised as 'song'.
function getSongTracks() {
    return state.tracks.filter(t => albumCategory(albumKey(t)) === 'song');
}

// Anything not an audiobook — used for "Recently Added" so the user sees songs
// AND new album tracks they just imported.
function getListenableTracks() {
    return state.tracks.filter(t => !isAudiobookTrack(t));
}

function renderSongsView() {
    if (!state.tracks.length) return renderEmptyLibrary();
    let tracks = applySearch(getSongTracks());
    tracks.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    return `
        <div class="view-header">
            <div>
                <div class="view-title">Songs</div>
                <div class="view-subtitle">${tracks.length} track${tracks.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="view-actions">
                <button class="btn-ghost" onclick="playList(${jsArg(tracks.map(t => t.id))})">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Play All
                </button>
                <button class="btn-ghost" onclick="shufflePlay(${jsArg(tracks.map(t => t.id))})">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                    Shuffle
                </button>
            </div>
        </div>
        ${renderTrackList(tracks)}`;
}

function renderRecentsView() {
    if (!state.tracks.length) return renderEmptyLibrary();
    const tracks = getListenableTracks().sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).slice(0, 100);
    return `
        <div class="view-header">
            <div>
                <div class="view-title">Recently Added</div>
                <div class="view-subtitle">Last ${tracks.length} added</div>
            </div>
        </div>
        ${renderTrackList(tracks)}`;
}

function renderTrackList(tracks) {
    if (!tracks.length) return '<div class="empty"><div class="empty-text">No tracks.</div></div>';
    return `
        <div class="track-list-header">
            <div>#</div>
            <div>Title</div>
            <div>Album</div>
            <div>Time</div>
            <div></div>
        </div>
        <div class="track-list">
            ${tracks.map((t, i) => renderTrackRow(t, i)).join('')}
        </div>`;
}

function renderTrackRow(t, i) {
    const isPlaying = state.currentTrack && state.currentTrack.id === t.id;
    const ext = t.ext || (((t.file && t.file.name) || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '';
    const unsupported = t.playable === false;
    const bmCount = (t.bookmarks || []).length;
    const badges = `${ext ? `<span class="fmt-badge">${escapeHtml(ext.toUpperCase())}</span>` : ''}${unsupported ? '<span class="fmt-badge warn" title="Browser cannot decode this file">⚠</span>' : ''}${bmCount ? `<span class="fmt-badge bm" title="View stars" onclick="event.stopPropagation(); showBookmarksModal('${t.id}')">★${bmCount}</span>` : ''}`;
    return `
        <div class="track-row ${isPlaying ? 'playing' : ''} ${unsupported ? 'unsupported' : ''}" data-id="${t.id}" data-idx="${i}" oncontextmenu="showTrackMenu(event, '${t.id}'); return false;">
            <div class="track-num"><span>${i + 1}</span></div>
            <div class="track-title">${escapeHtml(t.title)}<div style="font-size:12px;color:var(--text-dim);font-weight:400;margin-top:2px">${escapeHtml(t.artist)} ${badges}</div></div>
            <div class="track-meta">${escapeHtml(displayTrackAlbum(t))}</div>
            <div class="track-time">${fmtTime(t.duration)}</div>
            <button class="track-menu" onclick="event.stopPropagation(); showTrackMenu(event, '${t.id}')">⋯</button>
        </div>`;
}

// Human label for any view object — used for the back-button hint so users
// see *where* they'll land before tapping.
function viewLabel(view) {
    if (!view) return 'Back';
    if (view.kind === 'home') return 'Home';
    if (view.kind === 'albums') return 'Albums';
    if (view.kind === 'songs') return 'Songs';
    if (view.kind === 'audiobooks') return 'Audiobooks';
    if (view.kind === 'recents') return 'Recently Added';
    if (view.kind === 'shelf') return 'The Shelf';
    if (view.kind === 'storage') return 'On this device';
    if (view.kind === 'album' || view.kind === 'audiobook') {
        const a = getAlbum(view.id);
        return a ? displayAlbumName(a) : 'Back';
    }
    if (view.kind === 'playlist') {
        const pl = state.playlists.find(p => p.id === view.id);
        return pl ? pl.name : 'Playlist';
    }
    return 'Back';
}

function renderDetailBackBar() {
    const prev = state.viewHistory[state.viewHistory.length - 1];
    const label = prev ? viewLabel(prev) : 'Home';
    return `
        <button class="detail-back" onclick="goBack()" aria-label="Back to ${escapeHtml(label)}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            <span>${escapeHtml(label)}</span>
        </button>`;
}

function renderAlbumDetail(key, isAudiobook) {
    const album = getAlbum(key);
    if (!album) { state.currentView = { kind: 'albums' }; return renderAlbumsView(getAlbums(), 'Albums', 'albums'); }
    const totalSec = album.tracks.reduce((s, t) => s + (t.duration || 0), 0);
    const trackIds = album.tracks.map(t => t.id);
    // Single-file audiobook with embedded chapters → show chapters instead of tracks
    const singleWithChapters = isAudiobook && album.tracks.length === 1 && Array.isArray(album.tracks[0].chapters) && album.tracks[0].chapters.length > 1;
    const itemCount = singleWithChapters ? album.tracks[0].chapters.length : album.tracks.length;
    const itemLabel = isAudiobook ? 'chapter' : 'track';
    const category = albumCategory(key);
    const kindLabel = category === 'audiobook' ? 'Audiobook' : category === 'song' ? 'Songs' : 'Album';
    const done = state.finished.has(key);
    const prog = category === 'audiobook' && !done && state.positions.has(key) ? bookProgress(key) : null;
    const going = prog && prog.done > 30;
    const bookSpeed = category === 'audiobook' ? (state.bookPrefs.get(key) || {}).speed : null;
    return `
        ${renderDetailBackBar()}
        <div class="detail-hero">
            <div class="detail-art">${albumArtHTML(album)}</div>
            <div class="detail-info">
                <div class="detail-kind">${kindLabel}</div>
                <div class="detail-name">${escapeHtml(displayAlbumName(album))}</div>
                <div class="detail-author">${escapeHtml(album.artist)}</div>
                <div class="detail-stats">${itemCount} ${itemLabel}${itemCount !== 1 ? 's' : ''} · ${fmtTime(totalSec)}${bookSpeed && bookSpeed !== 1 ? ` · plays at ${bookSpeed}×` : ''}</div>
                ${going ? `<div class="detail-progress"><span class="book-bar"><i style="width:${(prog.frac * 100).toFixed(1)}%"></i></span><span class="book-left">${fmtLeft(prog.left)}</span></div>` : ''}
                <div class="detail-actions">
                    <button class="btn-play" onclick="playAlbum(${jsArg(key)})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        ${going ? 'Resume' : 'Play'}
                    </button>
                    ${category === 'audiobook' ? `<button class="pill-toggle ${done ? 'on' : ''}" onclick="setFinished(${jsArg(key)}, ${!done})" title="${done ? 'Tap to mark as not finished' : 'Mark as finished'}">${done ? '✓ Finished' : 'Mark finished'}</button>` : ''}
                    ${singleWithChapters ? '' : `<button class="btn-icon" onclick="shufflePlay(${jsArg(trackIds)})" title="Shuffle">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>

                    ${renderCategoryPicker(key)}

                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
                    </button>
                </div>
            </div>
        </div>

}

function handleAlbumPlayClick(key, btn) {
    if (btn) {
        btn.classList.remove('pop');
        // Force a reflow so the keyframe re-runs even on repeat taps.
        void btn.offsetWidth;
        btn.classList.add('pop');
    }
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
    const cur = state.currentTrack;
    if (cur && albumKey(cur) === key) {
        if (audio.paused) audio.play().catch(e => console.warn('play() rejected', e));
        else audio.pause();
        return;
    }
    playAlbum(key);
}
