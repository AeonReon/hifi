function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Embed any value as a JS expression inside a double-quoted HTML attribute.
function jsArg(v) { return JSON.stringify(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ============================================================
// THE SHELF
// Everything that lives on the Mac mini — the car music master, plus the
// spoken shelf (audiobooks, podcasts, talks). You browse it here, play a
// track straight off the mini, or pull a copy down into the library. Only
// what you pull down shows up in Albums / Songs / Audiobooks, which is the
// whole point: the player stays a player.
// ============================================================
function shelfUrl(pathOrUrl) {
    const base = (state.shelf.base || '').replace(/\/$/, '');
    const u = pathOrUrl.startsWith('http') ? pathOrUrl : base + pathOrUrl;
    return u + (u.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(state.shelf.token || '');
}

async function loadShelfAuth() {
    const saved = await dbGet('meta', 'shelfAuth');
    if (saved?.value) {
        if (saved.value.base) state.shelf.base = saved.value.base;
        state.shelf.token = saved.value.token || null;
    }
}

async function saveShelfAuth() {
    await dbPut('meta', { key: 'shelfAuth', value: { base: state.shelf.base, token: state.shelf.token } });
}

// Turn a catalog entry into something playback understands. Cached so the
// same object comes back every time — queues hold ids, not copies.
function shelfObj(t) {
    const existing = state.shelf.objs.get('shelf:' + t.id);
    if (existing) return existing;
    const obj = {
        id: 'shelf:' + t.id,
        title: t.title,
        artist: t.genre,
        album: t.genre,
        albumArtist: 'The Shelf',
        trackNum: 0,
        duration: t.seconds || 0,
        mimeType: '',
        ext: ((t.file || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '',
        playable: true,
        addedAt: 0,
        kind: t.kind === 'spoken' ? 'audiobook' : 'music',
        remote: t,
        artwork: null,
        chapters: t.chapters || null,
        bookmarks: [],
        lyrics: null,
    };
    state.shelf.objs.set(obj.id, obj);
    return obj;
}

async function loadShelf(force) {
    if (!state.shelf.token) return;
    if (state.shelf.loading) return;
    if (state.shelf.loaded && !force) return;
    state.shelf.loading = true;
    state.shelf.error = null;
    if (state.currentView.kind === 'shelf') render();
    try {
        const res = await fetch(shelfUrl('/catalog.json'), { cache: 'no-store' });
        if (res.status === 401) {
            state.shelf.token = null;
            await saveShelfAuth();
            throw new Error('The PIN changed — connect again.');
        }
        if (!res.ok) throw new Error('The mini answered ' + res.status);
        const data = await res.json();
        state.shelf.tracks = data.tracks || [];
        for (const t of state.shelf.tracks) {
            const o = shelfObj(t);
            o.remote = t;                         // fresh phone-copy / chapter info
            o.chapters = t.chapters || null;
        }
        state.shelf.loaded = true;
        adoptShelfChapters();
        adoptShelfCovers();
        checkWaiting();
        checkRestore().catch(() => {});
        if (!state.shelf.resumedOnce) { state.shelf.resumedOnce = true; resumeCutOffDownloads().catch(() => {}); }
    } catch (err) {
        console.warn('Shelf load failed', err);
        state.shelf.error = /Failed to fetch|NetworkError|Load failed/i.test(String(err && err.message))
            ? 'Cannot reach the mini. It may be asleep, or you may be offline.'
            : String(err && err.message || err);
    } finally {
        state.shelf.loading = false;
        if (state.currentView.kind === 'shelf') render();
        refreshSidebarCounts();
    }
}

async function shelfConnect() {
    const pinEl = $('shelf-pin');
    const addrEl = $('shelf-addr');
    const pin = (pinEl?.value || '').trim();
    const addr = (addrEl?.value || '').trim().replace(/\/$/, '');
    if (addr) state.shelf.base = addr.startsWith('http') ? addr : 'https://' + addr;
    if (!pin) { toast('Enter the PIN'); return; }
    try {
        const res = await fetch(state.shelf.base + '/unlock.json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) {
            toast(res.status === 429 ? 'Too many tries — wait a few minutes' : 'That PIN was not right');
            return;
        }
        state.shelf.token = data.token;
        await saveShelfAuth();
        state.shelf.loaded = false;
        await loadShelf(true);
        render();
    } catch (err) {
        console.warn('Shelf connect failed', err);
        toast('Cannot reach the mini at that address');
    }
}

async function shelfForget() {
    state.shelf.token = null;
    state.shelf.tracks = [];
    state.shelf.loaded = false;
    await saveShelfAuth();
    render();
}

function ownedShelfIds() {
    const set = new Set();
    for (const t of state.tracks) if (t.shelfId) set.add(t.shelfId);
    return set;
}

function fmtSize(bytes) {
    if (!bytes) return '';
    const mb = bytes / 1048576;
    return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
}

function shelfVisible() {
    const q = (state.searchQuery || '').toLowerCase();
    const sec = state.shelf.section;
    const owned = sec === 'Downloaded' ? ownedShelfIds() : null;
    return state.shelf.tracks.filter(t =>
        (sec === 'All' || (owned ? owned.has(t.id) : t.genre === sec)) &&
        (!q || (t.title || '').toLowerCase().includes(q) || (t.genre || '').toLowerCase().includes(q)
            || (shelfSeries(t) || '').toLowerCase().includes(q)));
}

// Which series a shelf file belongs to. A folder inside a section is one
// (HORMOZI 100M, a folder of meditations). Loose files numbered the same way —
// "Kolbrin Bible Book 01 - …", "… Part 3" — are one too, once there are two of
// them. Nothing is moved on the mini; this is only how the list is drawn.
const SERIES_WORD = /^(.*?[^\s\-_:,(])[\s\-_:,(]*\b(?:book|part|chapter|ch|vol|volume|episode|ep|disc|cd|lecture|session)\.?\s*\d+\b/i;
let _seriesCache = { tracks: null, map: new Map() };
function shelfSeriesMap() {
    const tracks = state.shelf.tracks;
    if (_seriesCache.tracks === tracks) return _seriesCache.map;
    const map = new Map();
    const loose = new Map();
    for (const t of tracks) {
        const parts = String(t.id).split('/');       // lib / section / [folders…] / file
        if (parts.length > 3) { map.set(t.id, parts[2]); continue; }
        const m = SERIES_WORD.exec(t.title || '');
        if (!m) continue;
        const k = t.genre + '|' + m[1].toLowerCase();
        if (!loose.has(k)) loose.set(k, { name: m[1], ids: [] });
        loose.get(k).ids.push(t.id);
    }
    for (const g of loose.values()) if (g.ids.length > 1) for (const id of g.ids) map.set(id, g.name);
    _seriesCache = { tracks, map };
    return map;
}
function shelfSeries(t) { return shelfSeriesMap().get(t.id) || null; }
function seriesKey(t) { const n = shelfSeries(t); return n ? t.genre + '|' + n : null; }
function numericCompare(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }

function shelfTrackRow(t, owned) {
    const sh = state.shelf;
    const obj = shelfObj(t);
    const have = owned.has(t.id);
    const playing = state.currentTrack && state.currentTrack.id === obj.id;
    const btn = shelfButtonHtml(t.id, have);
    const chs = Array.isArray(t.chapters) && t.chapters.length > 1 ? `${t.chapters.length} chapters` : '';
    const size = t.phone ? `${fmtSize(t.phone.bytes)} for the phone` : fmtSize(t.bytes);
    const bits = [sh.group ? '' : t.genre, fmtTime(t.seconds || 0), chs, size].filter(Boolean).join(' · ');
    return `
        <div class="shelf-row ${playing ? 'playing' : ''} ${have ? 'have' : ''}" data-id="${escapeHtml(obj.id)}" data-shelf="${escapeHtml(t.id)}">
            <div class="shelf-main">
                ${t.cover ? `<span class="shelf-cover"><img loading="lazy" alt="" src="${escapeHtml(shelfUrl(t.cover))}"><span class="shelf-tick" aria-hidden="true">✓</span></span>`
                    : `<span class="shelf-tick" aria-hidden="true">${have ? '✓' : ''}</span>`}
                <div>
                    <div class="shelf-name">${escapeHtml(t.title)}</div>
                    <div class="shelf-sub">${escapeHtml(bits)}${have ? ' · <b class="shelf-on">on this device</b>' : ''}</div>
                </div>
            </div>
            <div class="shelf-actions">${btn}<button class="shelf-menu" data-act="menu">⋯</button></div>
        </div>`;
}

// One button, five states: downloading, waiting its turn, cut off part-way,
// on the device, or not yet.
function shelfButtonHtml(rel, have) {
    const sh = state.shelf;
    if (sh.waiting.has(rel)) {
        const t = sh.tracks.find(x => x.id === rel);
        const pct = t && (sh.waiting.get(rel) === 'boost' ? null : t.phonePct);
        return `<button class="shelf-dl working" data-act="unwait" title="The mini is making the small phone copy — it starts by itself">Making${pct != null ? ' ' + pct + '%' : '…'} ✕</button>`;
    }
    if (sh.active === rel) return `<button class="shelf-dl working" data-act="pause">${sh.busy.get(rel) || 0}% ✕</button>`;
    if (sh.queue.includes(rel)) return `<button class="shelf-dl working" data-act="unqueue">Waiting ✕</button>`;
    if (have) return `<button class="shelf-dl have" data-act="remove">✓ On device</button>`;
    if (sh.partial.has(rel)) return `<button class="shelf-dl resume" data-act="download">⟳ Resume ${sh.partial.get(rel)}%</button>`;
    return `<button class="shelf-dl" data-act="download">⤓ Download</button>`;
}

function shelfGroupRow(g, owned) {
    const have = g.tracks.filter(t => owned.has(t.id)).length;
    const secs = g.tracks.reduce((a, t) => a + (t.seconds || 0), 0);
    const all = have === g.tracks.length;
    const bits = [state.shelf.section === 'All' ? g.genre : '', `${g.tracks.length} parts`,
        secs ? fmtTime(secs) : '', have ? (all ? '' : `${have} on this device`) : ''].filter(Boolean).join(' · ');
    return `
        <div class="shelf-row shelf-group ${all ? 'have' : ''}" data-group="${escapeHtml(g.key)}">
            <div class="shelf-main">
                ${g.tracks.find(t => t.cover) ? `<span class="shelf-cover"><img loading="lazy" alt="" src="${escapeHtml(shelfUrl(g.tracks.find(t => t.cover).cover))}"><span class="shelf-tick" aria-hidden="true">✓</span></span>`
                    : '<span class="shelf-stack" aria-hidden="true"><i></i><i></i><i></i></span>'}
                <div>
                    <div class="shelf-name">${escapeHtml(g.name)}</div>
                    <div class="shelf-sub">${escapeHtml(bits)}${all ? ' · <b class="shelf-on">all on this device</b>' : ''}</div>
                </div>
            </div>
            <div class="shelf-actions"><span class="shelf-chev">›</span></div>
        </div>`;
}

function renderShelfView() {
    const sh = state.shelf;
    if (!sh.token) {
        return `
            <div class="view-header"><div>
                <div class="view-title">The Shelf</div>
                <div class="view-subtitle">Everything on the Mac mini</div>
            </div></div>
            <div class="shelf-connect">
                <div class="empty-icon">⌂</div>
                <div class="empty-title">Connect to the mini</div>
                <div class="empty-text">Enter the PIN once and this device stays connected.</div>
                <input class="modal-input" id="shelf-pin" inputmode="numeric" autocomplete="off" placeholder="PIN">
                <input class="shelf-addr" id="shelf-addr" value="${escapeHtml(sh.base)}" spellcheck="false">
                <div style="margin-top:16px"><button class="btn-primary" id="shelf-connect-btn" style="margin:0 auto">Connect</button></div>
                <div class="shelf-note">Your music stays on the mini. Play it from here, or download a copy into this player — downloading is the only thing that adds it to your library.</div>
            </div>`;
    }
    if (sh.loading && !sh.tracks.length) {
        return `<div class="empty"><div class="empty-icon">◌</div><div class="empty-title">Reading the shelf…</div></div>`;
    }
    if (sh.error) {
        return `
            <div class="view-header"><div><div class="view-title">The Shelf</div></div></div>
            <div class="empty">
                <div class="empty-icon">⚠</div>
                <div class="empty-title">The shelf is out of reach</div>
                <div class="empty-text">${escapeHtml(sh.error)}<br>Everything you have already downloaded still plays.</div>
                <button class="btn-primary" id="shelf-retry-btn">Try again</button>
            </div>`;
    }
    const owned = ownedShelfIds();
    const newCount = sh.tracks.filter(t => t.genre === 'New').length;
    const q = (state.searchQuery || '').trim();

    // Inside one series: just its parts, in order, with a way back out.
    if (sh.group) {
        const members = sh.tracks.filter(t => seriesKey(t) === sh.group)
            .filter(t => !q || (t.title || '').toLowerCase().includes(q.toLowerCase()))
            .sort((a, b) => numericCompare(a.id, b.id));
        const name = sh.group.split('|').slice(1).join('|');
        const have = members.filter(t => owned.has(t.id)).length;
        const left = members.filter(t => !owned.has(t.id)).length;
        return `
            <div class="view-header shelf-header">
                <div>
                    <button class="shelf-back" id="shelf-back-btn">‹ The Shelf</button>
                    <div class="view-title">${escapeHtml(name)}</div>
                    <div class="view-subtitle">${members.length} parts · ${have} on this device</div>
                </div>
                <div class="view-actions">
                    ${left ? `<button class="btn-primary" id="shelf-getall-btn">Download ${left === members.length ? 'all' : 'the other ' + left}</button>` : ''}
                    ${have ? `<button class="btn-ghost" id="shelf-dropall-btn">Remove from device</button>` : ''}
                </div>
            </div>
            <div class="shelf-list">${members.map(t => shelfTrackRow(t, owned)).join('')}</div>`;
    }

    // "New" is the inbox everything lands in, so it sits first — it is the one
    // you actually want to look at. "Downloaded" sits last, like VidQ.
    const found = Array.from(new Set(sh.tracks.map(t => t.genre))).sort();
    const sections = ['All', ...found.filter(g => g === 'New'), ...found.filter(g => g !== 'New'),
        ...(owned.size ? ['Downloaded'] : [])];
    if (!sections.includes(sh.section)) sh.section = 'All';
    const chips = sections.map(g =>
        `<button class="shelf-chip ${g === sh.section ? 'on' : ''}" data-section="${escapeHtml(g)}">${escapeHtml(g)}${
            g === 'Downloaded' ? ' · ' + owned.size : ''}</button>`).join('');
    const list = shelfVisible();

    // A search shows every matching file; otherwise a series is one row.
    let rows;
    if (q) rows = list.map(t => shelfTrackRow(t, owned)).join('');
    else {
        const entries = [];
        const groups = new Map();
        for (const t of list) {
            const k = seriesKey(t);
            if (!k) { entries.push({ sortA: t.genre, sortB: t.title, html: () => shelfTrackRow(t, owned) }); continue; }
            if (!groups.has(k)) {
                const g = { key: k, name: shelfSeries(t), genre: t.genre, tracks: [] };
                groups.set(k, g);
                entries.push({ sortA: t.genre, sortB: g.name, html: () => shelfGroupRow(g, owned) });
            }
            groups.get(k).tracks.push(t);
        }
        entries.sort((a, b) => a.sortA.localeCompare(b.sortA) || numericCompare(a.sortB, b.sortB));
        rows = entries.map(e => e.html()).join('');
    }
    return `
        <div class="view-header shelf-header">
            <div>
                <div class="view-title">The Shelf</div>
                <div class="view-subtitle">${sh.tracks.length} on the mini · ${owned.size} on this device</div>
            </div>
            <div class="view-actions">
                ${newCount ? `<button class="btn-primary" id="shelf-sort-btn">${sh.sorting
                    ? 'Sorting…' : `Sort ${newCount} new`}</button>` : ''}
                <button class="btn-ghost" id="shelf-refresh-btn">Refresh</button>
            </div>
        </div>
        ${sh.restore ? renderRestoreCard(sh.restore) : ''}
        <div class="shelf-chips">${chips}</div>
        ${list.length ? `<div class="shelf-list">${rows}</div>`
            : `<div class="empty"><div class="empty-icon">⌕</div><div class="empty-text">Nothing here matches.</div></div>`}
        <div class="shelf-note" style="text-align:center;margin-top:24px">
            Tap a row to play it straight from the mini. Download to keep it in this player — remove it any time and it stays on the shelf. Big files come down in pieces, so a dropped signal or a locked screen just pauses them; they carry on where they stopped. The ⋯ menu can save a copy to Files instead.
            <br><a href="#" id="shelf-forget" style="color:var(--text-faint)">Disconnect this device</a>
        </div>`;
}

function bindShelfView() {
    if (state.currentView.kind !== 'shelf') return;
    const connect = $('shelf-connect-btn');
    if (connect) {
        connect.addEventListener('click', shelfConnect);
        $('shelf-pin')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') shelfConnect(); });
        setTimeout(() => $('shelf-pin')?.focus(), 60);
    }
    $('shelf-retry-btn')?.addEventListener('click', () => loadShelf(true));
    $('shelf-refresh-btn')?.addEventListener('click', () => loadShelf(true));
    $('shelf-forget')?.addEventListener('click', (e) => { e.preventDefault(); shelfForget(); });
    document.querySelectorAll('.shelf-chip').forEach(c => {
        c.addEventListener('click', () => { state.shelf.section = c.dataset.section; state.shelf.group = null; render(); });
    });
    $('shelf-sort-btn')?.addEventListener('click', sortShelf);
    $('shelf-back-btn')?.addEventListener('click', () => { state.shelf.group = null; render(); });
    const groupMembers = () => state.shelf.tracks.filter(t => seriesKey(t) === state.shelf.group)
        .sort((a, b) => numericCompare(a.id, b.id));
    $('shelf-getall-btn')?.addEventListener('click', () => {
        const owned = ownedShelfIds();
        shelfAskDownload(groupMembers().filter(t => !owned.has(t.id)).map(t => t.id));
    });
    $('shelf-dropall-btn')?.addEventListener('click', async () => {
        const owned = groupMembers().filter(t => ownedShelfIds().has(t.id));
        if (!confirm(`Remove ${owned.length} from this device? They stay on the shelf.`)) return;
        for (const t of owned) await shelfRemove(t.id, true);
        toast(`Removed ${owned.length} — still on the shelf`);
        render();
    });
    document.querySelectorAll('.shelf-group').forEach(row => {
        row.addEventListener('click', () => {
            state.shelf.group = row.dataset.group;
            render();
            $('main')?.scrollTo({ top: 0 });
        });
    });
    document.querySelectorAll('.shelf-row[data-shelf]').forEach(row => {
        const rel0 = row.dataset.shelf;
        attachLongPress(row, (e) => showShelfMenu(e, rel0));
        row.addEventListener('contextmenu', (e) => { e.preventDefault(); showShelfMenu(e, rel0); });
        row.addEventListener('click', (e) => {
            const btn = e.target.closest('.shelf-dl, .shelf-menu');
            const rel = row.dataset.shelf;
            if (btn) {
                e.stopPropagation();
                if (btn.dataset.act === 'download') shelfAskDownload([rel]);
                else if (btn.dataset.act === 'remove') shelfRemove(rel);
                else if (btn.dataset.act === 'pause') shelfPause(rel);
                else if (btn.dataset.act === 'unqueue') shelfUnqueue(rel);
                else if (btn.dataset.act === 'unwait') { state.shelf.waiting.delete(rel); render(); }
                else if (btn.dataset.act === 'menu') showShelfMenu(e, rel);
                return;
            }
            const ids = Array.from(document.querySelectorAll('.shelf-row[data-id]')).map(r => r.dataset.id);
            playList(ids, ids.indexOf(row.dataset.id));
        });
    });
}

// Update one row's button mid-download, so a 800 MB pull doesn't re-render
// (and re-scroll) the whole list on every piece.
function paintShelfRow(rel) {
    if (state.currentView.kind !== 'shelf') return;
    for (const row of document.querySelectorAll('.shelf-row[data-shelf]')) {
        if (row.dataset.shelf !== rel) continue;
        const btn = row.querySelector('.shelf-dl');
        if (!btn) return;
        const pct = state.shelf.busy.get(rel);
        if (pct === undefined) return;
        btn.className = 'shelf-dl working';
        btn.dataset.act = 'pause';
        btn.textContent = pct + '% ✕';
        return;
    }
}

// ---- Downloading, in pieces ----
// The old way pulled the whole file in one go and held it in memory until the
// end. An 800 MB audiobook (Aristotle's Politics) is more than iOS lets a tab
// hold, so the tab died around 30–40%, and any blip on the line lost the lot.
// Now each 4 MB piece is asked for on its own, written straight to IndexedDB
// (which keeps blobs on disk, not in memory), and asked for again if it
// drops. A download cut off by a crash, a locked screen or a lost signal keeps
// its pieces and carries on from the last one. One download runs at a time;
// the rest wait their turn rather than fighting over the tunnel.
const PIECE = 4 * 1048576;
const dlKey = (rel) => 'dl|' + rel;
const partKey = (rel, i) => 'part|' + rel + '|' + String(i).padStart(6, '0');
const partRange = (rel) => IDBKeyRange.bound('part|' + rel + '|', 'part|' + rel + '|\uffff');
const sleepMs = (ms) => new Promise(r => setTimeout(r, ms));

async function partsGetAll(range) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const req = db.transaction('parts', 'readonly').objectStore('parts').getAll(range);
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => rej(req.error);
    });
}
// A piece and the note of how far we've got go in one transaction, so a crash
// can never leave them disagreeing.
async function partsPut(values) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction('parts', 'readwrite');
        for (const v of values) tx.objectStore('parts').put(v);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
}
async function partsClear(rel) {
    const db = await openDB();
    return new Promise((res, rej) => {
        const tx = db.transaction('parts', 'readwrite');
        tx.objectStore('parts').delete(partRange(rel));
        tx.objectStore('parts').delete(dlKey(rel));
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
    });
}

// Keep the screen awake while something is coming down — iOS pauses a page
// the moment the phone locks. (If it locks anyway, we just carry on after.)
let wakeLock = null;
async function holdWake() {
    try {
        if (!wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
    } catch { wakeLock = null; }
}
function dropWake() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }

// ---- Mobile data guard ----
// Android tells a web app whether it is on Wi-Fi or mobile data; iPhone never
// does (Safari has no way to ask). So: on known Wi-Fi, just go. On known
// mobile data, ask before anything over 20 MB. Where we can't tell (every
// iPhone), ask before anything over 150 MB — so a mis-tap on an 800 MB
// audiobook can never quietly eat the allowance.
const BIG_UNKNOWN = 150 * 1048576;
const BIG_MOBILE = 20 * 1048576;
function netKind() {
    const t = navigator.connection && navigator.connection.type;
    if (t === 'wifi' || t === 'ethernet') return 'wifi';
    if (t === 'cellular') return 'mobile';
    return 'unknown';
}
function okToDownload(bytes, what) {
    const k = netKind();
    if (k === 'wifi') return true;
    if (k === 'mobile' && bytes < BIG_MOBILE) return true;
    if (k === 'unknown' && bytes < BIG_UNKNOWN) return true;
    return confirm(k === 'mobile'
        ? `You're on mobile data.\n\n${what} ${/^These /.test(what) ? 'come to' : 'is'} ${fmtSize(bytes)}. Download it anyway?`
        : `${what} ${/^These /.test(what) ? 'come to' : 'is'} ${fmtSize(bytes)}.\n\nIf you're on mobile data rather than Wi-Fi, that all comes out of your allowance. Download it now?`);
}
// ---- Which copy comes down ----
// Anything on the spoken shelf has a phone copy made by the mini: mono, voice
// levelled, chapters inside, about a quarter of the size. That's the default.
// A book with Voice boost on takes the boosted copy instead. 'full' is the
// file exactly as it sits on the shelf — music always, a book only if asked.
const shelfTrack = (rel) => state.shelf.tracks.find(x => x.id === rel) || null;
function defaultCopy(t) {
    if (!t || t.kind !== 'spoken') return 'full';
    if (t.phoneState === 'skip') return 'full';          // already small — nothing to gain
    return 'phone';
}
function copyReady(t, src) {
    if (src === 'phone') return !!t.phone;
    if (src === 'boost') return !!t.boost;
    return true;
}
function copyOf(t, src) {
    const base = (t.file || 'audio').replace(/\.[^.]+$/, '');
    if (src === 'phone' && t.phone) return { url: t.phone.download, bytes: t.phone.bytes, name: base + '.m4b' };
    if (src === 'boost' && t.boost) return { url: t.boost.download, bytes: t.boost.bytes, name: base + ' (voice boost).m4b' };
    return { url: t.download, bytes: t.bytes, name: t.file };
}
// What we expect to pull down — a copy not made yet is guessed from its length.
function copyBytes(t, src) {
    if (copyReady(t, src)) return copyOf(t, src).bytes;
    return Math.round((t.seconds || 0) * 6000) || t.bytes;
}
const COPY_LABEL = { phone: 'Phone copy', boost: 'Voice boost', full: 'Full size' };

// What a tap on Download goes through. Carrying on by itself after a cut-off
// does not ask again — you already said yes.
//   opts.src: a copy for all, or a Map rel -> copy (a restore)
//   opts.replace: swap the copy already on the device for this one
function shelfAskDownload(rels, opts = {}) {
    const sh = state.shelf;
    const owned = ownedShelfIds();
    const todo = rels.filter(r => (opts.replace || !owned.has(r)) && sh.active !== r && !sh.queue.includes(r) && shelfTrack(r));
    if (!todo.length) return false;
    const srcOf = (r) => opts.src instanceof Map ? (opts.src.get(r) || defaultCopy(shelfTrack(r))) : (opts.src || defaultCopy(shelfTrack(r)));
    const bytes = todo.reduce((a, r) => {
        const t = shelfTrack(r);
        const src = srcOf(r);
        const partial = (sh.want.get(r) || defaultCopy(t)) === src ? (sh.partial.get(r) || 0) : 0;
        // A part-download only needs what is left.
        return a + copyBytes(t, src) * (1 - partial / 100);
    }, 0);
    const first = shelfTrack(todo[0]);
    const what = todo.length > 1 ? `These ${todo.length}` : `"${first ? first.title : 'This'}"`;
    if (!okToDownload(bytes, what)) return false;
    for (const r of todo) shelfDownload(r, srcOf(r), !!opts.replace);
    return true;
}
// Android only: walking out of Wi-Fi mid-download pauses it rather than
// carrying on over mobile data. Resume asks first.
navigator.connection?.addEventListener?.('change', () => {
    if (netKind() !== 'mobile' || !state.shelf.active) return;
    state.shelf.queue = [];
    state.shelf.stop = true;
});

function shelfDownload(rel, src, replace) {
    const sh = state.shelf;
    const t = shelfTrack(rel);
    if (!t || sh.active === rel || sh.queue.includes(rel)) return;
    if (!replace && ownedShelfIds().has(rel)) return;
    src = src || defaultCopy(t);
    if (replace) sh.replacing.add(rel); else sh.replacing.delete(rel);
    // The mini hasn't made that copy yet: ask it to do this one next, and
    // start by ourselves the moment it's there.
    if (!copyReady(t, src)) {
        sh.waiting.set(rel, src);
        hurryCopy(rel, src === 'boost');
        render();
        return;
    }
    sh.waiting.delete(rel);
    sh.want.set(rel, src);
    sh.queue.push(rel);
    if (sh.active) render();
    pumpDownloads();
}

async function hurryCopy(rel, boost) {
    try {
        const enc = rel.split('/').map(encodeURIComponent).join('/');
        await fetch(shelfUrl('/hurry/' + enc + (boost ? '?boost=1' : '')), { method: 'POST' });
    } catch {}
    startWaitPoll();
}
// While anything is waiting on the mini, look at the catalog every few
// seconds. Give up quietly after 20 minutes — the mini may be asleep.
let _waitPoll = null, _waitSince = 0;
function startWaitPoll() {
    if (_waitPoll) return;
    _waitSince = Date.now();
    _waitPoll = setInterval(async () => {
        if (!state.shelf.waiting.size || Date.now() - _waitSince > 20 * 60000) {
            if (state.shelf.waiting.size) { state.shelf.waiting.clear(); toast('The mini is taking a while — try the download again later'); render(); }
            clearInterval(_waitPoll); _waitPoll = null; return;
        }
        await loadShelf(true);
    }, 6000);
}
// After a catalog load: anything whose copy is now made starts downloading.
function checkWaiting() {
    const sh = state.shelf;
    for (const [rel, src] of Array.from(sh.waiting)) {
        const t = shelfTrack(rel);
        if (!t) { sh.waiting.delete(rel); continue; }
        if (copyReady(t, src)) { sh.waiting.delete(rel); shelfDownload(rel, src, sh.replacing.has(rel)); }
        else if (src === 'phone' && t.phoneState === 'skip') { sh.waiting.delete(rel); shelfDownload(rel, 'full', sh.replacing.has(rel)); }
    }
    // The voice switch on a streamed book waits the same way.
    const cur = state.currentTrack;
    if (cur && cur.remote && state._boostSwitchPending) {
        const want = prefsFor(cur).boost ? 'boost' : 'phone';
        if (copyReady(cur.remote, want)) { state._boostSwitchPending = false; switchStreamCopy(); }
    }
}

function shelfPause(rel) {
    if (state.shelf.active === rel) state.shelf.stop = true;
}
function shelfUnqueue(rel) {
    state.shelf.queue = state.shelf.queue.filter(x => x !== rel);
    render();
}

async function pumpDownloads() {
    const sh = state.shelf;
    if (sh.active) return;
    const rel = sh.queue.shift();
    if (!rel) { dropWake(); return; }
    sh.active = rel;
    sh.stop = false;
    sh.busy.set(rel, sh.partial.get(rel) || 0);
    render();
    holdWake();
    const t = sh.tracks.find(x => x.id === rel);
    try {
        await runDownload(t);
        sh.partial.delete(rel);
        if (!sh.queue.length) toast('Downloaded: ' + t.title);
    } catch (err) {
        if (err && err.paused) toast(netKind() === 'mobile'
            ? "Paused — you're on mobile data now. Resume will ask first"
            : 'Paused — tap Resume to carry on');
        else if (/quota/i.test(String(err && (err.name + err.message)))) {
            toast('No room left on this device');
            sh.queue = [];
        } else if (err && err.locked) {
            toast('The mini wants the PIN again');
            sh.queue = [];
        } else {
            console.error('Shelf download failed', err);
            toast('The mini stopped answering — it will carry on when it can');
            sh.cutOff.add(rel);
        }
    } finally {
        sh.active = null;
        sh.busy.delete(rel);
        await refreshPartials();
        render();
        pumpDownloads();
    }
}

async function fetchPiece(url, start, end) {
    let wait = 1000;
    for (let attempt = 0; ; attempt++) {
        if (state.shelf.stop) throw Object.assign(new Error('paused'), { paused: true });
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 60000);
        try {
            const res = await fetch(url, { headers: { Range: `bytes=${start}-${end}` }, cache: 'no-store', signal: ctl.signal });
            if (res.status === 401 || res.status === 403) throw Object.assign(new Error('locked'), { locked: true });
            if (res.status !== 206 && !(res.status === 200 && start === 0)) throw new Error('HTTP ' + res.status);
            let blob = await res.blob();
            // A server that ignores Range sends the whole file — keep only our slice.
            if (res.status === 200) blob = blob.slice(0, end - start + 1);
            if (blob.size !== end - start + 1) throw new Error(`short piece ${blob.size}/${end - start + 1}`);
            return blob;
        } catch (err) {
            if (err.locked || attempt >= 8) throw err;
            // Waiting out a locked screen: don't burn retries while hidden.
            while (document.visibilityState === 'hidden' && !state.shelf.stop) await sleepMs(1000);
            await sleepMs(wait);
            wait = Math.min(wait * 2, 15000);
        } finally {
            clearTimeout(timer);
        }
    }
}

async function runDownload(t) {
    const rel = t.id;
    const src = state.shelf.want.get(rel) || defaultCopy(t);
    const copy = copyOf(t, copyReady(t, src) ? src : 'full');
    const size = copy.bytes;
    if (!size) throw new Error('no size in the catalog');
    const url = shelfUrl(copy.url);
    const pieces = Math.ceil(size / PIECE);
    const replace = state.shelf.replacing.has(rel);
    let m = await dbGet('parts', dlKey(rel));
    if (!m || m.size !== size || (m.src || 'full') !== src) {   // new, another copy, or the file changed
        await partsClear(rel);
        m = { key: dlKey(rel), rel, size, src, replace, done: 0, tries: 0 };
    }
    m.tries = (m.tries || 0) + 1;
    await partsPut([m]);
    for (let i = m.done; i < pieces; i++) {
        const start = i * PIECE;
        const end = Math.min(size, start + PIECE) - 1;
        const blob = await fetchPiece(url, start, end);
        m.done = i + 1;
        await partsPut([{ key: partKey(rel, i), blob }, { ...m }]);
        const pct = Math.min(99, Math.floor(m.done / pieces * 100));
        if (pct !== state.shelf.busy.get(rel)) { state.shelf.busy.set(rel, pct); paintShelfRow(rel); }
        if (state.shelf.stop) throw Object.assign(new Error('paused'), { paused: true });
    }
    // Stitch the pieces into one file. Blobs read back out of IndexedDB are
    // references to disk, so this doesn't pull 800 MB into memory either.
    const blobs = (await partsGetAll(partRange(rel))).map(r => r.blob);
    const total = blobs.reduce((a, b) => a + b.size, 0);
    if (blobs.length !== pieces || total !== size) {
        await partsClear(rel);
        throw new Error(`pieces don't add up (${total}/${size}) — starting that one again`);
    }
    const ext = (copy.name.match(/\.([a-z0-9]+)$/i) || [])[1] || '';
    const type = { mp3: 'audio/mpeg', m4a: 'audio/mp4', m4b: 'audio/mp4', aac: 'audio/aac', ogg: 'audio/ogg',
        opus: 'audio/ogg', wav: 'audio/wav', flac: 'audio/flac' }[ext.toLowerCase()] || 'audio/mpeg';
    const file = new File(blobs, copy.name, { type });
    const old = replace ? state.tracks.filter(x => x.shelfId === rel) : [];
    const made = await importFiles([file], shelfImportExtra(t, src));
    if (!made || !made.length) throw new Error('import failed');
    for (const o of old) await carryOver(o, made[0]);
    if (!made[0].artwork && t.cover) adoptShelfCovers();
    state.shelf.replacing.delete(rel);
    await partsClear(rel);
    applyPendingBooks();
    requestPersist();
    scheduleBackup(true);
}

// How a shelf file is filed once it's on the device. Spoken word is always a
// book. The parts of a series (a folder, or "Book 01…Book 11") become ONE book
// with its parts in order, so it has one place-marker and one finished tick.
function shelfImportExtra(t, src) {
    const extra = { shelfId: t.id, shelfCopy: src };
    if (t.kind !== 'spoken') return extra;
    extra.kind = 'audiobook';
    const series = shelfSeries(t);
    if (series) {
        const members = state.shelf.tracks.filter(x => seriesKey(x) === seriesKey(t)).sort((a, b) => numericCompare(a.id, b.id));
        extra.album = series;
        extra.albumArtist = 'The Shelf';
        extra.trackNum = members.findIndex(x => x.id === t.id) + 1;
    } else {
        extra.albumFallback = t.title;
    }
    if (Array.isArray(t.chapters) && t.chapters.length > 1) extra.chaptersFallback = t.chapters;
    return extra;
}

// One copy of a book swapped for another (phone copy for the full file, the
// boosted copy for the plain one): the new one inherits everything — stars,
// playlists, your place, the finished tick, its speed — and if it's playing,
// it carries on from the same second.
async function carryOver(oldT, newT) {
    const oldKey = albumKey(oldT), newKey = albumKey(newT);
    newT.bookmarks = oldT.bookmarks || [];
    newT.addedAt = oldT.addedAt || newT.addedAt;
    if (!newT.lyrics && oldT.lyrics) newT.lyrics = oldT.lyrics;
    await dbPut('tracks', newT);
    for (const pl of state.playlists) {
        if (!pl.trackIds.includes(oldT.id)) continue;
        pl.trackIds = pl.trackIds.map(i => i === oldT.id ? newT.id : i);
        await dbPut('playlists', pl);
    }
    const pos = state.positions.get(oldKey);
    if (pos && pos.trackId === oldT.id) {
        const v = { ...pos, trackId: newT.id };
        if (oldKey !== newKey) clearPosition(oldKey);
        state.positions.set(newKey, v);
        await dbPut('meta', { key: 'ab-pos-' + newKey, value: v });
    }
    if (oldKey !== newKey) {
        if (state.finished.has(oldKey)) { state.finished.delete(oldKey); state.finished.add(newKey); await saveFinished(); }
        if (state.bookPrefs.has(oldKey)) { state.bookPrefs.set(newKey, state.bookPrefs.get(oldKey)); state.bookPrefs.delete(oldKey); await saveBookPrefs(); }
    }
    const playingOld = state.currentTrack && state.currentTrack.id === oldT.id;
    state.queue = state.queue.map(i => i === oldT.id ? newT.id : i);
    await dbDelete('tracks', oldT.id);
    state.tracks = state.tracks.filter(x => x.id !== oldT.id);
    if (playingOld) {
        const at = audio.currentTime || 0;
        const wasPlaying = !audio.paused;
        state.currentTrack = newT;
        if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
        currentObjectURL = URL.createObjectURL(playableBlob(newT));
        audio.src = currentObjectURL;
        audio.playbackRate = speedFor(newT);
        await new Promise(r => audio.addEventListener('loadedmetadata', r, { once: true }));
        audio.currentTime = at;
        if (wasPlaying) audio.play().catch(() => {});
        updateTrackInfo();
    }
}

// Downloaded books without a picture of their own take the mini's painted
// cover. Covers arrive over time (a couple of minutes each), so this runs on
// every shelf load and only fetches what's newly there.
async function adoptShelfCovers() {
    let changed = false;
    for (const t of state.tracks) {
        if (!t.shelfId || t.artwork || t._coverTried) continue;
        const s = shelfTrack(t.shelfId);
        if (!s || !s.cover) continue;
        t._coverTried = true;
        try {
            const r = await fetch(shelfUrl(s.cover));
            if (!r.ok) continue;
            const blob = await r.blob();
            if (!blob.size || !/^image\//.test(blob.type)) continue;
            t.artwork = blob;
            const { _coverTried, _fellBack, ...clean } = t;
            await dbPut('tracks', clean);
            artworkCache.delete(t.id);
            changed = true;
        } catch {}
    }
    if (changed) {
        if (state.currentView.kind !== 'shelf') render();
        if (state.currentTrack) { updateTrackInfo(); if ('mediaSession' in navigator) updateMediaSession(state.currentTrack); }
    }
}

// Tracks downloaded before the mini could find chapters pick them up now.
async function adoptShelfChapters() {
    let changed = false;
    for (const t of state.tracks) {
        if (!t.shelfId || (Array.isArray(t.chapters) && t.chapters.length > 1)) continue;
        const s = shelfTrack(t.shelfId);
        if (!s || !Array.isArray(s.chapters) || s.chapters.length < 2) continue;
        t.chapters = s.chapters;
        await dbPut('tracks', t);
        changed = true;
    }
    if (changed && ['audiobook', 'album'].includes(state.currentView.kind)) render();
    if (changed && state.currentTrack) updateNpChapters(state.currentTrack);
}

// Streaming a book: the small copy when the mini has it (less data, same
// chapters), the boosted one when that's switched on.
function streamUrlFor(track) {
    const r = track.remote;
    if (r.kind !== 'spoken') return r.url;
    if (prefsFor(track).boost && r.boost) return r.boost.url;
    if (r.phone) return r.phone.url;
    return r.url;
}
async function switchStreamCopy() {
    const t = state.currentTrack;
    if (!t || !t.remote) return;
    const at = audio.currentTime || 0;
    const wasPlaying = !audio.paused;
    audio.src = shelfUrl(streamUrlFor(t));
    audio.playbackRate = speedFor(t);
    await new Promise(r => audio.addEventListener('loadedmetadata', r, { once: true }));
    audio.currentTime = at;
    if (wasPlaying) audio.play().catch(() => {});
}

// Which downloads were cut off part-way, and how far each got.
async function refreshPartials() {
    try {
        const notes = await partsGetAll(IDBKeyRange.bound('dl|', 'dl|\uffff'));
        state.shelf.partial = new Map(notes.map(n =>
            [n.rel, Math.min(99, Math.floor(n.done / Math.ceil(n.size / PIECE) * 100))]));
        return notes;
    } catch { return []; }
}

// On opening Hifi, a download that was cut off carries on by itself — unless
// it has already failed a few times, which means something is properly wrong
// and it should wait for a tap rather than loop.
async function resumeCutOffDownloads() {
    const notes = await refreshPartials();
    if (netKind() === 'mobile') return;               // wait for Wi-Fi, or a tap
    for (const n of notes) if ((n.tries || 0) < 4) shelfDownload(n.rel, n.src || 'full', !!n.replace);
}

// Coming back to the app, or getting signal back, restarts anything that
// stopped because the line went dead.
function retryCutOff() {
    const sh = state.shelf;
    if (sh.active) { holdWake(); return; }
    if (netKind() === 'mobile') return;
    for (const rel of sh.cutOff) shelfDownload(rel, sh.want.get(rel), sh.replacing.has(rel));
    sh.cutOff.clear();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') retryCutOff(); });
window.addEventListener('online', retryCutOff);

function showShelfMenu(e, rel) {
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    const t = state.shelf.tracks.find(x => x.id === rel);
    if (!t) return;
    const have = ownedShelfIds().has(rel);
    const obj = shelfObj(t);
    openCtxMenu(e, [
        { label: 'Play from the mini', action: () => playList([obj.id], 0) },
        { divider: true },
        have ? { label: 'Remove the download', action: () => shelfRemove(rel), danger: true }
             : { label: state.shelf.partial.has(rel) ? 'Carry on downloading' : 'Download into Hifi', action: () => shelfAskDownload([rel]) },
        ...(t.kind === 'spoken' && !have && t.phoneState !== 'skip'
            ? [{ label: `Download the full-size file (${fmtSize(t.bytes)})`, action: () => shelfAskDownload([rel], { src: 'full' }) }] : []),
        ...(have && t.phone && (state.tracks.find(x => x.shelfId === rel) || {}).shelfCopy === 'full'
            ? [{ label: `Swap for the phone copy — frees ${fmtSize(t.bytes - t.phone.bytes)}`, action: () => shelfAskDownload([rel], { src: 'phone', replace: true }) }] : []),
        ...(state.shelf.partial.has(rel) && state.shelf.active !== rel
            ? [{ label: 'Throw away the part-download', danger: true, action: async () => {
                  await partsClear(rel); await refreshPartials(); render(); } }] : []),
        { label: 'Save a copy to Files', action: () => shelfSaveToFiles(rel) },
    ]);
}

// The odd time you want the actual file rather than a track in the player.
// /get sends Content-Disposition: attachment, so a plain navigation saves it —
// on iOS that lands in Files → Downloads. When we already hold the file, the
// share sheet is nicer (and skips pulling 200 MB down a second time).
async function shelfSaveToFiles(rel) {
    const t = state.shelf.tracks.find(x => x.id === rel);
    if (!t) return;
    const local = state.tracks.find(x => x.shelfId === rel);
    if (local && local.file && navigator.canShare) {
        try {
            const file = new File([local.file], t.file, { type: local.file.type || 'audio/mpeg' });
            if (navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file] });
                return;
            }
        } catch (err) {
            if (err && err.name === 'AbortError') return;   // share sheet dismissed
            console.warn('Share failed, falling back to a download', err);
        }
    }
    const a = document.createElement('a');
    a.href = shelfUrl(t.download);
    a.download = t.file;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Saving a copy…');
}

// Sort the New inbox — the mini does the work, we just wait for it.
async function sortShelf() {
    if (state.shelf.sorting) return;
    state.shelf.sorting = true;
    render();
    try {
        const res = await fetch(shelfUrl('/sort'), { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        for (let i = 0; i < 300; i++) {                    // up to ~10 minutes
            await new Promise(r => setTimeout(r, 2000));
            const st = await (await fetch(shelfUrl('/sort-status'), { cache: 'no-store' })).json();
            if (st.running) continue;
            const last = st.last || {};
            if (last.error) toast('Sorting failed: ' + last.error);
            else {
                const n = (last.moved || []).length;
                const left = (last.left || []).length;
                toast(n ? `Sorted ${n}${left ? `, ${left} left in New` : ''}` : 'Nothing to sort');
            }
            break;
        }
    } catch (err) {
        console.error('Sort failed', err);
        toast('Could not reach the mini to sort');
    } finally {
        state.shelf.sorting = false;
        await loadShelf(true);
        render();
    }
}

async function shelfRemove(rel, quiet) {
    const ids = state.tracks.filter(t => t.shelfId === rel).map(t => t.id);
    for (const id of ids) await deleteTrack(id);
    if (quiet) return;
    toast('Removed from this device — still on the shelf');
    render();
}

// ============================================================
// KEEPING DOWNLOADS SAFE
// iOS may clear a web app's storage when the phone runs short of space. We
// ask the browser not to (navigator.storage.persist), and we keep a note on
// the mini of what this device holds and where you are in every book. If the
// phone is ever wiped, Hifi finds that note and puts it all back in one tap.
// ============================================================
function guessDeviceName() {
    const ua = navigator.userAgent || '';
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
    if (/Android/.test(ua)) return 'Android phone';
    if (/Macintosh/.test(ua)) return 'Mac';
    if (/Windows/.test(ua)) return 'Windows PC';
    return 'A device';
}
async function loadDevice() {
    const d = await dbGet('meta', 'device');
    if (d?.value?.id) { state.device = d.value; return; }
    state.device = { id: 'd-' + uid() + uid(), name: guessDeviceName(), since: Date.now() };
    await dbPut('meta', { key: 'device', value: state.device });
}
async function requestPersist() {
    try {
        if (!navigator.storage) return;
        state.persisted = navigator.storage.persisted ? await navigator.storage.persisted() : null;
        if (!state.persisted && navigator.storage.persist) state.persisted = await navigator.storage.persist();
    } catch {}
}

function backupPayload() {
    const owned = state.tracks.filter(t => t.shelfId).map(t => ({ rel: t.shelfId, copy: t.shelfCopy || 'full' }));
    const books = [];
    const seen = new Set();
    for (const t of state.tracks) {
        if (!t.shelfId) continue;
        const k = albumKey(t);
        if (seen.has(k)) continue;
        seen.add(k);
        const album = getAlbum(k);
        if (!album) continue;
        const p = state.positions.get(k);
        const cur = p && album.tracks.find(x => x.id === p.trackId);
        const pref = state.bookPrefs.get(k) || {};
        books.push({
            rels: album.tracks.map(x => x.shelfId).filter(Boolean),
            cur: cur ? cur.shelfId : null, pos: p ? Math.floor(p.position) : 0, ts: p ? p.ts : 0,
            done: state.finished.has(k), speed: pref.speed || null, boost: !!pref.boost,
        });
    }
    return { name: state.device.name, owned, books };
}
let _backupTimer = null, _backupDirty = false;
function scheduleBackup(soon) {
    _backupDirty = true;
    if (!state.shelf.token) return;
    clearTimeout(_backupTimer);
    _backupTimer = setTimeout(() => backupNow(), soon ? 1500 : 30000);
}
async function backupNow(leaving) {
    if (!state.shelf.token || !state.device) return;
    clearTimeout(_backupTimer);
    try {
        const res = await fetch(shelfUrl('/devices/' + state.device.id), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(backupPayload()), keepalive: !!leaving,
        });
        if (res.ok) { state.lastBackup = Date.now(); _backupDirty = false; }
    } catch {}
}
// Leaving the app is the moment most likely to be the last one: send it then.
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && _backupDirty) backupNow(true);
});

// After the shelf loads: is there a note from a device whose downloads aren't
// here? On a device with nothing from the shelf on it (new, or wiped), offer it.
async function checkRestore() {
    if (!state.device) return;
    const res = await fetch(shelfUrl('/devices'), { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    const sh = state.shelf;
    sh.devices = data.devices || [];
    const mine = ownedShelfIds();
    const onShelf = new Set(sh.tracks.map(t => t.id));
    const dismissed = (await dbGet('meta', 'restoreDismissed'))?.value || [];
    const missing = (d) => (d.owned || []).filter(o => onShelf.has(o.rel) && !mine.has(o.rel));
    const cand = sh.devices.find(d => d.id !== state.device.id && !dismissed.includes(d.id) && missing(d).length);
    const before = sh.restore;
    sh.restore = mine.size === 0 && cand ? { ...cand, missing: missing(cand) } : null;
    if (!!before !== !!sh.restore && ['home', 'shelf', 'storage'].includes(state.currentView.kind)) render();
    // First backup from this device, so the mini knows about it from day one.
    if (_backupDirty || !state.lastBackup) scheduleBackup(true);
}

function restoreSize(d) {
    return (d.missing || []).reduce((a, o) => { const t = shelfTrack(o.rel); return a + (t ? copyBytes(t, pickRestoreCopy(t, o.copy)) : 0); }, 0);
}
function pickRestoreCopy(t, copy) {
    if (copy === 'boost') return 'boost';
    if (copy === 'phone' || defaultCopy(t) === 'phone') return 'phone';
    return 'full';
}
function renderRestoreCard(d) {
    // A series counts once; spoken word is a book, anything else a track.
    const things = new Map();
    for (const o of d.missing || []) {
        const t = shelfTrack(o.rel);
        if (t) things.set(seriesKey(t) || t.id, t.kind === 'spoken');
    }
    const nBooks = Array.from(things.values()).filter(Boolean).length;
    const nTracks = things.size - nBooks;
    const count = [nBooks ? `${nBooks} book${nBooks !== 1 ? 's' : ''}` : '', nTracks ? `${nTracks} track${nTracks !== 1 ? 's' : ''}` : '']
        .filter(Boolean).join(' and ');
    const when = new Date(d.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    return `<div class="dev-card restore-card">
        <h3>Put back what was on your ${escapeHtml(d.name)}?</h3>
        <p>${count} · ${fmtSize(restoreSize(d))} · last seen ${escapeHtml(when)}. Your place in every book and your finished ticks come back too.</p>
        <div class="row">
            <button class="btn-primary" data-restore="${escapeHtml(d.id)}">Put them back</button>
            <button class="btn-ghost" data-restore-no="${escapeHtml(d.id)}">Not now</button>
        </div>
    </div>`;
}
async function restoreFrom(id) {
    const d = state.shelf.devices.find(x => x.id === id);
    if (!d) return;
    const mine = ownedShelfIds();
    const items = (d.owned || []).filter(o => shelfTrack(o.rel) && !mine.has(o.rel));
    const src = new Map(items.map(o => [o.rel, pickRestoreCopy(shelfTrack(o.rel), o.copy)]));
    state.pendingBooks = (d.books || []).map(b => ({ ...b }));
    await dbPut('meta', { key: 'pendingBooks', value: state.pendingBooks });
    applyPendingBooks();
    if (shelfAskDownload(items.map(o => o.rel), { src })) {
        state.shelf.restore = null;
        toast(`Putting back ${items.length} — they come down one at a time`);
        render();
    }
}
async function dismissRestore(id) {
    const cur = (await dbGet('meta', 'restoreDismissed'))?.value || [];
    await dbPut('meta', { key: 'restoreDismissed', value: [...cur, id] });
    state.shelf.restore = null;
    render();
}
// As each restored file lands, its book gets its place, tick and settings back.
async function applyPendingBooks() {
    if (!state.pendingBooks.length) return;
    const byRel = new Map(state.tracks.filter(t => t.shelfId).map(t => [t.shelfId, t]));
    const left = [];
    for (const b of state.pendingBooks) {
        const any = b.rels.map(r => byRel.get(r)).find(Boolean);
        if (!any) { left.push(b); continue; }
        const k = albumKey(any);
        const cur = b.cur && byRel.get(b.cur);
        if (b.cur && !cur) { left.push(b); continue; }   // wait for the part you were in
        if (cur && b.pos > 5 && !state.positions.has(k)) {
            const v = { trackId: cur.id, position: b.pos, ts: b.ts || Date.now() };
            state.positions.set(k, v);
            await dbPut('meta', { key: 'ab-pos-' + k, value: v });
        }
        if (b.done) state.finished.add(k);
        if (b.speed || b.boost) state.bookPrefs.set(k, { ...(state.bookPrefs.get(k) || {}), ...(b.speed ? { speed: b.speed } : {}), ...(b.boost ? { boost: true } : {}) });
    }
    state.pendingBooks = left;
    await Promise.all([saveFinished(), saveBookPrefs(), dbPut('meta', { key: 'pendingBooks', value: left })]);
}

// ============================================================
// VOICE BOOST
// A louder, clearer copy of a book, made by the mini. Built into the file
// rather than done live, because iPhone suspends Web Audio when the screen
// locks — a live filter would stop the book in your pocket.
// ============================================================
function boostTarget(t) {
    // The shelf file behind the track playing (downloaded or streamed).
    if (!t) return null;
    if (t.remote) return t.remote.kind === 'spoken' ? t.remote : null;
    if (t.shelfId) { const s = shelfTrack(t.shelfId); return s && s.kind === 'spoken' ? s : null; }
    return null;
}
function updateBoostUI() {
    const b = $('np-boost');
    if (!b) return;
    const t = state.currentTrack;
    const target = boostTarget(t);
    const on = !!prefsFor(t).boost;
    b.disabled = !target;

async function refreshEstimate() {

function bindStorageView() {

let carWake = null;

function carOpen() { return $('car').classList.contains('active'); }
function updateCar(full) {

// ============================================================
// PLAYBACK
// ============================================================
let currentObjectURL = null;

async function playList(trackIds, startIdx = 0) {
    if (!Array.isArray(trackIds)) trackIds = [trackIds];
    state.queue = trackIds.slice();
    state.queueIdx = startIdx;
    await playCurrent();
}

async function playAlbum(key) {
    const album = getAlbum(key);
    if (!album) return;
    // A book carries on from the part you were in, not from part one.
    const p = state.positions.get(key);
    const at = p ? album.tracks.findIndex(t => t.id === p.trackId) : -1;
    await playList(album.tracks.map(t => t.id), Math.max(0, at));
}

async function shufflePlay(trackIds) {
    const arr = trackIds.slice();
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    await playList(arr, 0);
}

async function playCurrent() {
    if (state.queueIdx < 0 || state.queueIdx >= state.queue.length) return;
    const id = state.queue[state.queueIdx];
    const track = findTrack(id);
    if (!track) return;
    state.currentTrack = track;
    if (currentObjectURL) { URL.revokeObjectURL(currentObjectURL); currentObjectURL = null; }
    if (track.remote) {
        // Streamed straight off the mini — no copy is kept on this device.
        audio.src = shelfUrl(streamUrlFor(track));
    } else {
        currentObjectURL = URL.createObjectURL(playableBlob(track));
        audio.src = currentObjectURL;
    }
    audio.playbackRate = speedFor(track);
    audio.defaultPlaybackRate = audio.playbackRate;
    audio.volume = state.settings.volume;
    updateSpeedUI();
    updateBoostUI();

    // Resume audiobook position
    const k = albumKey(track);
    if (isSpokenTrack(track) || state.audiobookIds.has(k)) {
        const saved = state.positions.get(k);
        if (saved && saved.trackId === track.id && saved.position > 5) {
            audio.currentTime = saved.position;
        }
    }

    // Update UI first so the user sees what's loading even if play() is delayed/blocked
    updateTrackInfo();
    if ('mediaSession' in navigator) updateMediaSession(track);
    document.querySelectorAll('.track-row, .shelf-row').forEach(r => r.classList.toggle('playing', r.dataset.id === track.id));
    try {
        await audio.play(); // 'play' event listener will sync isPlaying + icons
    } catch (e) {
        console.error('Playback failed', e);
        toast('Tap play to start');
    }
}

function togglePlay() {
    if (!state.currentTrack) {
        const songs = getSongTracks();
        if (songs.length) playList(songs.map(t => t.id), 0);
        else if (state.tracks.length) playList(state.tracks.map(t => t.id), 0);
        return;
    }
    // Don't set isPlaying optimistically — the audio element's 'play'/'pause' events
    // are the source of truth. Setting state up-front used to leave the icon stuck
    // showing pause when play() rejected (e.g. an unsupported codec).
    if (audio.paused) audio.play().catch(e => console.warn('play() rejected', e));
    else audio.pause();
}

// When the current track has embedded chapters, the prev/next buttons jump
// between chapters instead of between tracks.
function currentChapters() {
    const t = state.currentTrack;
    return (t && Array.isArray(t.chapters) && t.chapters.length > 1) ? t.chapters : null;
}
function currentChapterIdx() {
    const chs = currentChapters();
    if (!chs) return -1;
    const now = audio.currentTime || 0;
    for (let i = chs.length - 1; i >= 0; i--) if (now >= chs[i].time - 0.25) return i;
    return 0;
}

async function nextTrack() {
    const chs = currentChapters();
    if (chs) {
        const i = currentChapterIdx();
        if (i < chs.length - 1) { audio.currentTime = chs[i + 1].time; return; }
    }
    if (!state.queue.length) return;
    if (state.settings.shuffle) {
        state.queueIdx = Math.floor(Math.random() * state.queue.length);
    } else if (state.queueIdx < state.queue.length - 1) {
        state.queueIdx++;
    } else if (state.settings.repeat === 'all') {
        state.queueIdx = 0;
    } else {
        state.isPlaying = false;
        updatePlayUI();
        return;
    }
    await playCurrent();
}

async function prevTrack() {
    const chs = currentChapters();
    if (chs) {
        const i = currentChapterIdx();
        // If we're more than 3s into the current chapter, restart it; else go to previous chapter
        const chapterStart = chs[i]?.time || 0;
        if ((audio.currentTime || 0) - chapterStart > 3 || i === 0) {
            audio.currentTime = chapterStart;
            return;
        }
        audio.currentTime = chs[i - 1].time;
        return;
    }
    if (!state.queue.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (state.queueIdx > 0) state.queueIdx--;
    else if (state.settings.repeat === 'all') state.queueIdx = state.queue.length - 1;
    else { audio.currentTime = 0; return; }
    await playCurrent();
}

// Jump directly to a chapter of a specific track (used from the chapter list UI)
async function playChapter(trackId, chapterIdx) {
    // Ensure this track is loaded as the queue
    if (!state.currentTrack || state.currentTrack.id !== trackId) {
        state.queue = [trackId];
        state.queueIdx = 0;
        await playCurrent();
    }
    const track = findTrack(trackId);
    const ch = track?.chapters?.[chapterIdx];
    if (!ch) return;
    // Wait for metadata if seeking right after load
    if (audio.readyState < 1) {
        await new Promise(res => audio.addEventListener('loadedmetadata', res, { once: true }));
    }

function updatePlayUI() {

function updateNpLyrics(t) {
    const panel = $('np-lyrics-panel');
    const btn = $('np-lyrics');
    const lyrics = Array.isArray(t.lyrics) && t.lyrics.length ? t.lyrics : null;
    btn.style.opacity = lyrics ? '1' : '0.45';
    btn.title = lyrics ? 'Hide lyrics' : 'No lyrics for this track';

        return;
    }
    panel.innerHTML = lyrics.map((l, i) =>
        `<div class="np-lyric-line" data-lidx="${i}" data-t="${l.time}">${escapeHtml(l.text)}</div>`

function updateLyricsHighlight() {
    const panel = $('np-lyrics-panel');
    if (!panel || panel.hidden) return;
    const t = state.currentTrack;
    if (!t || !Array.isArray(t.lyrics) || !t.lyrics.length) return;
    const cur = audio.currentTime || 0;
    let idx = -1;
    for (let i = t.lyrics.length - 1; i >= 0; i--) {
        if (cur >= t.lyrics[i].time - 0.15) { idx = i; break; }
    }
    if (idx === state._lyricsIdx) return;
    state._lyricsIdx = idx;
    panel.querySelectorAll('.np-lyric-line').forEach((el, i) => {
        el.classList.toggle('is-current', i === idx);
        el.classList.toggle('is-past', i < idx);
    });
    const active = panel.querySelector('.np-lyric-line.is-current');
    if (active) {
        const top = active.offsetTop - panel.clientHeight / 2 + active.clientHeight / 2;
        panel.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });

function toggleLyrics() {
    const panel = $('np-lyrics-panel');
    const btn = $('np-lyrics');
    const t = state.currentTrack;
    const has = t && Array.isArray(t.lyrics) && t.lyrics.length;
    if (!has) { toast('No lyrics for this track. Drag in a .lrc file with the same name.'); return; }
    panel.hidden = !panel.hidden;
    btn.classList.toggle('lyrics-on', !panel.hidden);
    if (!panel.hidden) updateLyricsHighlight();
}

function updateNpChapters(t) {

    const chs = (Array.isArray(t.chapters) && t.chapters.length > 1) ? t.chapters : null;
    if (!chs) { wrap.hidden = true; wrap.innerHTML = ''; return; }
    wrap.hidden = false;
    wrap.innerHTML = `
        <div class="np-chapters-title">Chapters · ${chs.length}</div>
        <div class="np-chapters-list">
            ${chs.map((ch, i) => `<button class="np-chapter" data-chapter-idx="${i}" onclick="playChapter(${jsArg(t.id)}, ${i})">
                <span class="np-chapter-num">${i + 1}</span>
                <span class="np-chapter-title">${escapeHtml(ch.title || ('Chapter ' + (i + 1)))}</span>
                <span class="np-chapter-time">${fmtTime(ch.time)}</span>

function updateMediaSession(track) {
    navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: track.artist,
        album: track.album,
        artwork: track.artwork ? [{ src: artworkURL(track), type: track.artwork.type || 'image/jpeg' }]

    });
    const safe = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (_) {} };
    safe('play', () => togglePlay());
    safe('pause', () => togglePlay());
    safe('previoustrack', () => prevTrack());
    safe('nexttrack', () => nextTrack());
    safe('seekbackward', (d) => seekBy(-(d?.seekOffset || 15)));
    safe('seekforward', (d) => seekBy(+(d?.seekOffset || 15)));
    safe('seekto', (d) => { if (typeof d?.seekTime === 'number') audio.currentTime = d.seekTime; });
}

// ----- Seek helpers -----

}

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 700);
}

// Keep play/pause icons in sync with the audio element, no matter who triggers it
audio.addEventListener('play', () => { state.isPlaying = true; updatePlayUI(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
audio.addEventListener('pause', () => {
    state.isPlaying = false; updatePlayUI();

});
audio.addEventListener('waiting', () => updatePlayUI());
audio.addEventListener('canplay', () => updatePlayUI());
audio.addEventListener('loadedmetadata', () => {
    const dur = audio.duration || 0;

});
audio.addEventListener('error', () => {
    const err = audio.error;
    if (!err) return;
    const t = state.currentTrack;
    // A download from the Shelf that won't play: tell the mini exactly what
    // happened, and play the same book from the mini at the same spot so
    // you're never left with silence.
    if (t && t.shelfId && !t.remote && (err.code === 3 || err.code === 4) && reportAndFallBack(t, err)) return;
    const ext = t && t.file ? (((t.file.name || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '').toLowerCase() : '';
    const fmtLabel = ext ? ext.toUpperCase() : 'this file';
    const reasons = {
        1: 'Playback aborted',
        2: 'Network error reading the file',
        3: `Cannot decode ${fmtLabel}. The file may be corrupted or use a codec your browser does not understand.`,
        4: `Your browser cannot play ${fmtLabel} files. Try Chrome on desktop, or convert to MP3/M4A first.`,
    };
    toast(reasons[err.code] || 'Playback error');
    console.error('audio error', err.code, err.message);
});

function reportAndFallBack(t, err) {
    const s = shelfTrack(t.shelfId);
    const saved = state.positions.get(albumKey(t));
    const at = saved && saved.trackId === t.id ? saved.position : 0;
    if (state.shelf.token) {
        fetch(shelfUrl('/report'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
            build: BUILD, ua: navigator.userAgent, rel: t.shelfId, copy: t.shelfCopy || 'full',
            code: err.code, message: err.message || '', fileName: t.file && t.file.name, fileType: t.file && t.file.type,
            fileSize: t.file && t.file.size, expected: s ? (t.shelfCopy === 'phone' && s.phone ? s.phone.bytes : t.shelfCopy === 'boost' && s.boost ? s.boost.bytes : s.bytes) : null,
            canMp4: audio.canPlayType('audio/mp4'), standalone: !!navigator.standalone,
        }) }).catch(() => {});
    }
    if (!s || t._fellBack) return false;
    t._fellBack = true;
    const o = shelfObj(s);
    state.queue = state.queue.map(i => i === t.id ? o.id : i);
    playCurrent().then(() => {
        if (at > 5) {
            const seek = () => { audio.currentTime = at; };
            if (audio.readyState >= 1) seek(); else audio.addEventListener('loadedmetadata', seek, { once: true });
        }
    });
    toast("This download won't play on this phone — playing it from the mini instead");
    return true;
}

audio.addEventListener('timeupdate', () => {
    const cur = audio.currentTime || 0;
    const dur = audio.duration || 0;
    const pct = dur ? (cur / dur * 100) : 0;
    $('scrub-fill').style.width = pct + '%';
    $('np-scrub-fill').style.width = pct + '%';
    $('time-current').textContent = fmtTime(cur);
    $('time-total').textContent = fmtTime(dur);
    $('np-time-current').textContent = fmtTime(cur);
    $('np-time-total').textContent = fmtTime(dur);

    // A-B loop enforcement
    if (ab.a != null && ab.b != null && cur >= ab.b - 0.05) {
        audio.currentTime = ab.a;
    }

    // Highlight current chapter in chapter list, if visible
    if (currentChapters() && state._lastChapterIdx !== currentChapterIdx()) {
        state._lastChapterIdx = currentChapterIdx();
        document.querySelectorAll('[data-chapter-idx]').forEach(el => {
            el.classList.toggle('playing', parseInt(el.dataset.chapterIdx) === state._lastChapterIdx);
        });
    }

    updateLyricsHighlight();

    // Save audiobook position every ~3s
    const t = state.currentTrack;
    if (t && !audio.paused && cur > 0) {
        const k = albumKey(t);
        if (isSpokenTrack(t) || state.audiobookIds.has(k)) {
            if (!playCurrent._lastSave || Date.now() - playCurrent._lastSave > 3000) {

});
// Dragging the scrubber while paused is a new place too.
audio.addEventListener('seeked', () => {

});
// iOS sometimes resets the rate when a new source loads — put the book's back.
audio.addEventListener('loadedmetadata', () => {
    const want = speedFor(state.currentTrack);
    if (audio.playbackRate !== want) audio.playbackRate = want;
});

audio.addEventListener('ended', () => {
    if (state.settings.repeat === 'one') { audio.currentTime = 0; audio.play(); return; }
    // The last part of a book running out means the book is finished.
    const t = state.currentTrack;
    if (t && !t.remote && isAudiobookTrack(t)) {
        const k = albumKey(t);
        const album = getAlbum(k);
        if (album && album.tracks[album.tracks.length - 1].id === t.id && !state.finished.has(k)) {
            setFinished(k, true, true).then(() => {
                toast('Finished ✓ ' + displayAlbumName(album));
                if (['home', 'audiobooks', 'audiobook', 'storage'].includes(state.currentView.kind)) render();
            });
        }
    }
    nextTrack();
});

function bindScrub(scrubEl) {
    let dragging = false;
    const onMove = (e) => {
        const rect = scrubEl.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const pct = Math.max(0, Math.min(1, x / rect.width));
        if (audio.duration) audio.currentTime = pct * audio.duration;
    };
    scrubEl.addEventListener('mousedown', (e) => { dragging = true; onMove(e); });
    scrubEl.addEventListener('touchstart', (e) => { dragging = true; onMove(e); e.preventDefault(); }, { passive: false });
    document.addEventListener('mousemove', (e) => { if (dragging) onMove(e); });
    document.addEventListener('touchmove', (e) => { if (dragging) { onMove(e); e.preventDefault(); } }, { passive: false });
    document.addEventListener('mouseup', () => { dragging = false; });
    document.addEventListener('touchend', () => { dragging = false; });
}

function bindVol() {
    const bar = $('vol-bar');
    let dragging = false;
    const onMove = (e) => {
        const rect = bar.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const pct = Math.max(0, Math.min(1, x / rect.width));
        state.settings.volume = pct;
        audio.volume = pct;
        updateVolUI();
        saveSettings();
    };
    bar.addEventListener('mousedown', (e) => { dragging = true; onMove(e); });
    bar.addEventListener('touchstart', (e) => { dragging = true; onMove(e); }, { passive: true });
    document.addEventListener('mousemove', (e) => { if (dragging) onMove(e); });
    document.addEventListener('touchmove', (e) => { if (dragging) onMove(e); }, { passive: true });
    document.addEventListener('mouseup', () => { dragging = false; });
    document.addEventListener('touchend', () => { dragging = false; });
}

function updateVolUI() { $('vol-fill').style.width = (state.settings.volume * 100) + '%'; }

// ============================================================
// EQUALIZER (Web Audio API, 3-band BiquadFilter chain)
// Lazy-init: don't create AudioContext until the user actually opens EQ.
// ============================================================
const eq = {
    ctx: null,
    src: null,
    bass: null,
    mid: null,
    treble: null,
    gain: null,
    on: false,
    bands: { bass: 0, mid: 0, treble: 0, preamp: 0 },
};
const EQ_PRESETS = {
    'Flat': { bass: 0, mid: 0, treble: 0, preamp: 0 },
    'Bass boost': { bass: 8, mid: 0, treble: 2, preamp: -2 },
    'Treble boost': { bass: 0, mid: 0, treble: 8, preamp: -2 },
    'Voice / Audiobook': { bass: -3, mid: 5, treble: 4, preamp: 0 },
    'Loud (compressed)': { bass: 5, mid: 1, treble: 6, preamp: -3 },
    'Warm': { bass: 4, mid: -1, treble: -2, preamp: 0 },
    'Bright': { bass: -2, mid: 1, treble: 5, preamp: -1 },
};
function ensureEqGraph() {
    if (eq.ctx) return;
    try {
        eq.ctx = new (window.AudioContext || window.webkitAudioContext)();
        eq.src = eq.ctx.createMediaElementSource(audio);
        eq.bass = eq.ctx.createBiquadFilter(); eq.bass.type = 'lowshelf'; eq.bass.frequency.value = 200;
        eq.mid = eq.ctx.createBiquadFilter(); eq.mid.type = 'peaking'; eq.mid.frequency.value = 1000; eq.mid.Q.value = 1;
        eq.treble = eq.ctx.createBiquadFilter(); eq.treble.type = 'highshelf'; eq.treble.frequency.value = 4000;
        eq.gain = eq.ctx.createGain(); eq.gain.gain.value = 1;
        eq.src.connect(eq.bass).connect(eq.mid).connect(eq.treble).connect(eq.gain).connect(eq.ctx.destination);
        applyEqValues();
    } catch (e) { console.warn('EQ init failed', e); eq.ctx = null; }
}
function applyEqValues() {
    if (!eq.ctx) return;
    const b = eq.on ? eq.bands : { bass: 0, mid: 0, treble: 0, preamp: 0 };
    eq.bass.gain.value = b.bass;
    eq.mid.gain.value = b.mid;
    eq.treble.gain.value = b.treble;
    // preamp dB → linear
    eq.gain.gain.value = Math.pow(10, (b.preamp || 0) / 20);
}
function setEqOn(v) { eq.on = !!v; if (v) ensureEqGraph(); applyEqValues(); saveSettings(); updateEqUI(); }
function setEqBand(name, val) { eq.bands[name] = val; applyEqValues(); saveSettings(); }
function applyEqPreset(name) {
    const p = EQ_PRESETS[name]; if (!p) return;
    Object.assign(eq.bands, p);
    if (!eq.on) eq.on = true;
    ensureEqGraph(); applyEqValues(); saveSettings(); updateEqUI();
}
function showEqModal() {
    const presetBtns = Object.keys(EQ_PRESETS).map(n => `<button class="ctx-item" data-preset="${n}">${n}</button>`).join('');
    showModal(`
        <div class="modal-title">Equalizer</div>
        <label class="eq-toggle"><input type="checkbox" id="eq-on" ${eq.on ? 'checked' : ''}> Enable EQ</label>
        <div class="eq-row"><span>Bass</span><input type="range" id="eq-bass" min="-15" max="15" step="0.5" value="${eq.bands.bass}"><span class="eq-val" id="eq-bass-v">${eq.bands.bass}dB</span></div>
        <div class="eq-row"><span>Mid</span><input type="range" id="eq-mid" min="-15" max="15" step="0.5" value="${eq.bands.mid}"><span class="eq-val" id="eq-mid-v">${eq.bands.mid}dB</span></div>
        <div class="eq-row"><span>Treble</span><input type="range" id="eq-treble" min="-15" max="15" step="0.5" value="${eq.bands.treble}"><span class="eq-val" id="eq-treble-v">${eq.bands.treble}dB</span></div>
        <div class="eq-row"><span>Preamp</span><input type="range" id="eq-pre" min="-12" max="6" step="0.5" value="${eq.bands.preamp}"><span class="eq-val" id="eq-pre-v">${eq.bands.preamp}dB</span></div>
        <div class="eq-presets">${presetBtns}</div>
        <div class="modal-actions"><button class="btn-text" onclick="hideModal()">Done</button></div>
    `);
    $('eq-on').addEventListener('change', e => setEqOn(e.target.checked));
    const bind = (id, name, lblId) => {
        $(id).addEventListener('input', e => {
            const v = parseFloat(e.target.value);
            $(lblId).textContent = v + 'dB';
            setEqBand(name, v);
            if (!eq.on) { eq.on = true; $('eq-on').checked = true; ensureEqGraph(); applyEqValues(); }
        });
    };
    bind('eq-bass', 'bass', 'eq-bass-v');
    bind('eq-mid', 'mid', 'eq-mid-v');
    bind('eq-treble', 'treble', 'eq-treble-v');
    bind('eq-pre', 'preamp', 'eq-pre-v');
    document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => { applyEqPreset(b.dataset.preset); hideModal(); }));
}
function updateEqUI() { $('np-eq').classList.toggle('active', eq.on); }

const ab = { a: null, b: null };
