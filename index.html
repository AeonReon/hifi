async function addBookmark() {
    const t = state.currentTrack;
    if (!t) { toast('Nothing playing'); return; }
    const time = Math.floor(audio.currentTime || 0);
    const label = (currentChapters() ? (currentChapters()[currentChapterIdx()]?.title) : null) || `At ${fmtTime(time)}`;
    t.bookmarks = t.bookmarks || [];
    t.bookmarks.push({ time, label, ts: Date.now() });
    await dbPut('tracks', t);
    toast(`Starred at ${fmtTime(time)} — tap ★${t.bookmarks.length} on the track to view`);
    if (state.currentView.kind === 'audiobook' || state.currentView.kind === 'album') render();
}
async function deleteBookmark(trackId, idx) {
    const t = state.tracks.find(x => x.id === trackId);
    if (!t || !t.bookmarks) return;
    t.bookmarks.splice(idx, 1);
    await dbPut('tracks', t);
    showBookmarksModal(trackId);
}
function showBookmarksModal(trackId) {
    const t = state.tracks.find(x => x.id === trackId) || state.currentTrack;
    if (!t) { toast('No track'); return; }
    const bm = t.bookmarks || [];
    const list = bm.length
        ? bm.map((b, i) => `
            <div class="bm-row">
                <button class="bm-jump" data-time="${b.time}">${fmtTime(b.time)} · ${escapeHtml(b.label)}</button>
                <button class="bm-del" data-i="${i}" title="Delete">✕</button>
            </div>`).join('')
        : '<div style="color:var(--text-dim);padding:8px 0;font-size:14px">No stars yet. While playing, tap the ★ button (or press B) to mark a spot you want to come back to.</div>';
    showModal(`
        <div class="modal-title">Stars — ${escapeHtml(t.title)}</div>
        <div class="bm-list">${list}</div>
        <div class="modal-actions"><button class="btn-text" onclick="hideModal()">Close</button></div>
    `);
    document.querySelectorAll('.bm-jump').forEach(el => el.addEventListener('click', async () => {
        const time = parseFloat(el.dataset.time);
        if (state.currentTrack && state.currentTrack.id === t.id) {
            audio.currentTime = time;
        } else {
            await playList([t.id], 0);
            const seek = () => { audio.currentTime = time; audio.removeEventListener('loadedmetadata', seek); };
            audio.addEventListener('loadedmetadata', seek);
        }
        hideModal();
    }));
    document.querySelectorAll('.bm-del').forEach(el => el.addEventListener('click', () => deleteBookmark(t.id, parseInt(el.dataset.i))));
}

// NAV
// ============================================================
// Push the current view onto the history stack so goBack() can return to it.
// Dedupe consecutive duplicates and cap depth so audiobook-skipping sessions
// don't grow an unbounded stack.
function pushHistory() {
    const cur = state.currentView;
    if (!cur) return;
    const last = state.viewHistory[state.viewHistory.length - 1];
    const same = last && last.kind === cur.kind && last.id === cur.id;
    if (same) return;
    state.viewHistory.push({ kind: cur.kind, id: cur.id });
    if (state.viewHistory.length > 30) state.viewHistory.shift();
}

function goBack() {
    if (state.viewHistory.length === 0) {
        // Nothing to pop — land on home so the user is never stranded.
        state.currentView = { kind: 'home', id: null };
    } else {
        state.currentView = state.viewHistory.pop();
    }
    render();
    $('main').scrollTo({ top: 0 });
    closeSidebar();
}

function openDetail(kind, id) {
    pushHistory();
    state.currentView = { kind, id };
    render();
    $('main').scrollTo({ top: 0, behavior: 'smooth' });
    closeSidebar();
}

function navTo(view) {
    pushHistory();
    state.currentView = { kind: view };
    if (view === 'shelf') loadShelf();
    if (view === 'storage') refreshEstimate().then(() => { if (state.currentView.kind === 'storage') render(); });
    render();
    $('main').scrollTo({ top: 0 });
    closeSidebar();
}

document.querySelectorAll('.sidebar > .nav-section .nav-item[data-view]').forEach(n => {
    n.addEventListener('click', () => navTo(n.dataset.view));
});

function openSidebar() { $('sidebar').classList.add('open'); $('sidebar-backdrop').classList.add('active'); }
function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebar-backdrop').classList.remove('active'); }

// Long-press helper: fires `handler` after `delay`ms of unmoved touch, then
// swallows the trailing click so the underlying onclick (e.g. open detail) does
// NOT fire. Works on iOS (where contextmenu doesn't fire on long-press).
function attachLongPress(el, handler, opts = {}) {
    const delay = opts.delay || 480;
    let timer = null;
    let startX = 0, startY = 0;
    let fired = false;

    const fire = () => {
        fired = true;
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) {}
        handler({
            preventDefault: () => {},
            stopPropagation: () => {},
            clientX: startX,
            clientY: startY,
        });
    };
    const start = (e) => {
        const t = e.touches ? e.touches[0] : e;
        startX = t.clientX; startY = t.clientY;
        fired = false;
        clearTimeout(timer);
        timer = setTimeout(fire, delay);
    };
    const move = (e) => {
        if (timer === null) return;
        const t = e.touches ? e.touches[0] : e;
        if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
            clearTimeout(timer); timer = null;
        }
    };
    const end = () => { clearTimeout(timer); timer = null; };
    const clickGuard = (e) => {
        if (fired) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            fired = false;
        }
    };

    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchmove', move, { passive: true });
    el.addEventListener('touchend', end);
    el.addEventListener('touchcancel', end);
    // Capture-phase click guard so we beat the inline onclick handlers
    el.addEventListener('click', clickGuard, true);
}

function addTracksToPlaylistPrompt(playlistId) {
    const pl = state.playlists.find(p => p.id === playlistId);
    if (!pl) return;
    const all = [...state.tracks].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    if (!all.length) {
        toast('Your library is empty');
        return;
    }
    const already = new Set(pl.trackIds);
    const picked = new Set();
    const renderList = (filter) => {
        const q = (filter || '').trim().toLowerCase();
        const rows = all.filter(t => {
            if (!q) return true;
            return (t.title || '').toLowerCase().includes(q)
                || (t.artist || '').toLowerCase().includes(q)
                || (t.album || '').toLowerCase().includes(q);
        });
        if (!rows.length) return '<div style="color:var(--text-dim);padding:8px 0;font-size:14px">No matches.</div>';
        const check = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        return rows.map(t => {
            const inPl = already.has(t.id);
            const isPicked = picked.has(t.id);
            return `<div class="modal-list-item ${isPicked || inPl ? 'picked' : ''}" data-tid="${t.id}" ${inPl ? 'data-already="1"' : ''}>
                <div class="pick-box">${check}</div>
                <div class="pick-text">
                    <div>${escapeHtml(t.title)}${inPl ? ' <span style="color:var(--text-faint);font-weight:400">· already in</span>' : ''}</div>
                    <div class="pick-meta">${escapeHtml(t.artist || '')}${t.album ? ' · ' + escapeHtml(t.album) : ''}</div>
                </div>
            </div>`;
        }).join('');
    };
    const updateCount = () => {
        const btn = document.getElementById('add-tracks-confirm');
        if (btn) btn.textContent = picked.size ? `Add ${picked.size}` : 'Add';
    };
    showModal(`
        <div class="modal-title">Add tracks to "${escapeHtml(pl.name)}"</div>
        <input class="modal-input" id="add-tracks-search" placeholder="Search title, artist, album">
        <div class="modal-list" id="add-tracks-list">${renderList('')}</div>
        <div class="modal-actions">
            <button class="btn-text" onclick="hideModal()">Cancel</button>
            <button class="btn-primary" id="add-tracks-confirm">Add</button>
        </div>`);
    const listEl = document.getElementById('add-tracks-list');
    const searchEl = document.getElementById('add-tracks-search');
    const wireRows = () => {
        listEl.querySelectorAll('.modal-list-item').forEach(el => {
            el.addEventListener('click', () => {
                if (el.dataset.already === '1') return;
                const id = el.dataset.tid;
                if (picked.has(id)) { picked.delete(id); el.classList.remove('picked'); }
                else { picked.add(id); el.classList.add('picked'); }
                updateCount();
            });
        });
    };
    wireRows();
    searchEl.addEventListener('input', () => { listEl.innerHTML = renderList(searchEl.value); wireRows(); });
    document.getElementById('add-tracks-confirm').addEventListener('click', async () => {
        if (!picked.size) { hideModal(); return; }
        for (const id of picked) if (!pl.trackIds.includes(id)) pl.trackIds.push(id);
        await dbPut('playlists', pl);
        hideModal();
        toast(`Added ${picked.size} to ${pl.name}`);
        if (state.currentView.kind === 'playlist' && state.currentView.id === pl.id) render();
    });
}

async function deleteTrack(trackId) {
    if (state.tracks.some(t => t.id === trackId && t.shelfId)) scheduleBackup(true);
    await dbDelete('tracks', trackId);
    state.tracks = state.tracks.filter(t => t.id !== trackId);
    for (const pl of state.playlists) {
        if (pl.trackIds.includes(trackId)) {
            pl.trackIds = pl.trackIds.filter(i => i !== trackId);
            await dbPut('playlists', pl);
        }
    }
    if (state.currentTrack && state.currentTrack.id === trackId) {
        // Remove from queue and try to advance
        const removedIdx = state.queue.indexOf(trackId);
        state.queue = state.queue.filter(id => id !== trackId);
        if (state.queue.length) {
            state.queueIdx = Math.min(removedIdx, state.queue.length - 1);
            await playCurrent();
        } else {
            audio.pause();
            audio.removeAttribute('src');
            state.currentTrack = null;
            state.queueIdx = -1;
            $('player-title').textContent = 'Nothing playing';
            $('player-artist').textContent = '';
            $('player-art').innerHTML = '';
        }
    }
    render();
    toast('Removed');
}

function setSleep(mins) {
    if (state.sleepTimer) {
        if (typeof state.sleepTimer === 'object' && state.sleepTimer.cancel) state.sleepTimer.cancel();
        else clearTimeout(state.sleepTimer);
        state.sleepTimer = null;
    }
    if (mins === 0) { toast('Sleep timer cancelled'); $('sleep-btn').classList.remove('active'); $('np-sleep').classList.remove('active'); return; }
    if (mins === -1) {
        const onEnd = () => { audio.pause(); updatePlayUI(); audio.removeEventListener('ended', onEnd); $('sleep-btn').classList.remove('active'); $('np-sleep').classList.remove('active'); toast('Stopped (end of track)'); };
        audio.addEventListener('ended', onEnd);
        state.sleepTimer = { cancel: () => audio.removeEventListener('ended', onEnd) };
        toast('Will stop at end of track');
    } else if (mins === -2) {
        const chs = currentChapters();
        if (!chs) { toast('No chapters on this track — using End of track'); setSleep(-1); return; }
        const i = currentChapterIdx();
        const endTime = (i < chs.length - 1) ? chs[i + 1].time : (audio.duration || Infinity);
        const checker = setInterval(() => {
            if ((audio.currentTime || 0) >= endTime - 0.05) {
                audio.pause(); updatePlayUI(); clearInterval(checker);
                $('sleep-btn').classList.remove('active'); $('np-sleep').classList.remove('active');
                toast('Stopped (end of chapter)');
            }
        }, 500);
        state.sleepTimer = { cancel: () => clearInterval(checker) };
        toast('Will stop at end of chapter');
    } else {
        state.sleepTimer = setTimeout(() => {
            audio.pause();
            state.isPlaying = false;
            updatePlayUI();
            $('sleep-btn').classList.remove('active');
            $('np-sleep').classList.remove('active');
            toast('Sleep timer ended');
        }, mins * 60 * 1000);
        toast(`Sleep in ${mins} minutes`);
    }
    $('sleep-btn').classList.add('active');
    $('np-sleep').classList.add('active');
}

// Swipe-down on Now Playing fullscreen to dismiss
(function bindNpSwipeDown() {
    const np = $('now-playing-full');
    let startY = 0, dy = 0, dragging = false;
    np.addEventListener('touchstart', (e) => {
        if (np.scrollTop > 0) return;
        startY = e.touches[0].clientY;
        dy = 0;
        dragging = true;
    }, { passive: true });
    np.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        dy = e.touches[0].clientY - startY;
        if (dy > 0) np.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    np.addEventListener('touchend', () => {
        if (!dragging) return;
        dragging = false;
        if (dy > 110) np.classList.remove('active');
        np.style.transform = '';
    });
})();

document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight' && e.shiftKey) nextTrack();
    else if (e.key === 'ArrowLeft' && e.shiftKey) prevTrack();
    else if (e.key === 'ArrowRight') { e.preventDefault(); seekBy(+10); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seekBy(-10); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); state.settings.volume = Math.min(1, state.settings.volume + 0.05); audio.volume = state.settings.volume; updateVolUI(); saveSettings(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); state.settings.volume = Math.max(0, state.settings.volume - 0.05); audio.volume = state.settings.volume; updateVolUI(); saveSettings(); }
    else if (e.key === 'm' || e.key === 'M') { audio.muted = !audio.muted; toast(audio.muted ? 'Muted' : 'Unmuted'); }
    else if (e.key === 'b' || e.key === 'B') { addBookmark(); }
    else if (e.key === 'l' || e.key === 'L') { abPress(); }
    else if (e.key === 'Escape') { hideModal(); $('now-playing-full').classList.remove('active'); closeCar(); }
});
