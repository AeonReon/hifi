<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hifi</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hifi">
    <meta name="theme-color" content="#F7F4EE">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="1024x1024" href="icons/icon-1024.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            /* Surfaces — warm ivory page, white cards */
            --bg: #F7F4EE;
            --bg-deep: #FFFFFF;          /* white — sidebar/player/contrast layer (was dark) */
            --surface: #FFFFFF;
            --surface-2: #F0EBE0;
            --card: #FAF6EC;
            --card-hover: #ECE4D2;

            /* Ink */
            --text: #1A2433;             /* deep navy (from icon) */
            --text-dim: #5A6577;
            --text-faint: #9CA3AF;
            --ink-deep: #0E1623;         /* darkest — text on gold accent */

            /* Accent — gold (from icon waveform) */
            --accent: #D9A02D;
            --accent-bright: #F2BB44;
            --accent-dim: #A8771A;
            --accent-glow: rgba(217, 160, 45, 0.14);

            /* Secondary accent — blue (from icon backdrop), for gradient outlines */
            --accent-blue: #2D7AB8;
            --accent-blue-deep: #1F5A8E;

            /* Lines / borders */
            --border: rgba(217, 160, 45, 0.22);
            --border-strong: rgba(217, 160, 45, 0.45);
            --line: #EAE2CD;

            /* Status */
            --danger: #C75C5C;

            /* Shadows — warm, soft (light theme) */
            --shadow-sm: 0 2px 8px rgba(80, 50, 30, 0.06);
            --shadow:    0 8px 22px rgba(80, 50, 30, 0.10);
            --shadow-lg: 0 18px 50px rgba(80, 50, 30, 0.16);

            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --player-h: 92px;
        }

        /* ===== DARK THEME ===== sky-blue + yellow, pulled from the app icons */
        :root[data-theme="dark"] {
            --bg: #103464;            /* deep icon-blue (darker than mid-gradient for night comfort) */
            --bg-deep: #1A4380;        /* sidebar/player */
            --surface: #1A4380;        /* cards */
            --surface-2: #245599;      /* hover surface, brighter */
            --card: #1F4A8C;
            --card-hover: #2A5BA8;

            --text: #FFF6E0;           /* warm off-white, slight yellow tint */
            --text-dim: #B5C8E0;
            --text-faint: #708FB2;
            --ink-deep: #0A2042;       /* text on yellow accent — deep blue */

            --accent: #FFCC44;         /* icon yellow */
            --accent-bright: #FFDD66;
            --accent-dim: #E5A82A;
            --accent-glow: rgba(255, 204, 68, 0.22);

            --accent-blue: #4FA3E0;    /* secondary accent for outline gradients */
            --accent-blue-deep: #2D7AB8;

            --border: rgba(255, 204, 68, 0.22);
            --border-strong: rgba(255, 204, 68, 0.42);
            --line: rgba(255, 255, 255, 0.10);

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.30);
            --shadow:    0 8px 22px rgba(0, 0, 0, 0.40);
            --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.50);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "ss01", "ss02";
            user-select: none;
            -webkit-user-select: none;
        }

        button, input { font-family: inherit; color: inherit; }
        button { background: none; border: none; cursor: pointer; }
        input { background: none; border: none; outline: none; }

        /* ===== APP SHELL ===== */
        .app {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr var(--player-h);
            height: 100dvh;
            background: var(--bg);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            grid-row: 1;
            grid-column: 1;
            background: var(--bg-deep);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: calc(20px + var(--safe-top)) 14px 20px;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 24px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: radial-gradient(circle at 30% 30%, var(--accent-bright), var(--accent-dim));
            position: relative;
            box-shadow: 0 4px 16px rgba(201, 169, 97, 0.25);
        }
        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: var(--bg-deep);
            box-shadow: inset 0 0 0 2px var(--accent);
        }
        .brand-mark::before {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            background: var(--accent);
            z-index: 1;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-section {
            margin-bottom: 18px;
        }

        .nav-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-faint);
            padding: 0 12px 8px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 9px;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            position: relative;
        }
        .nav-item:hover { background: var(--surface-2); color: var(--text); }
        .nav-item.active { background: var(--accent-glow); color: var(--accent-dim); }
        .nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 18px;
            background: var(--accent);
            border-radius: 2px;
        }
        .nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.85; }
        .nav-item .label { flex: 1; }
        .nav-item .count { font-size: 11px; color: var(--text-faint); }

        .playlists-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            max-height: 260px;
            overflow-y: auto;
        }

        .new-playlist-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 9px;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 600;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            transition: color 0.15s, transform 0.1s;
        }
        .new-playlist-btn:hover { color: var(--accent-dim); transform: translateY(-1px); }

        /* ===== MAIN ===== */
        .main {
            grid-row: 1;
            grid-column: 2;
            overflow-y: auto;
            position: relative;
            background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 280px);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 251, 245, 0.82);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: calc(16px + var(--safe-top)) 32px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
        }
        :root[data-theme="dark"] .topbar { background: rgba(26, 67, 128, 0.82); }

        .menu-btn {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            color: var(--text);
            align-items: center;
            justify-content: center;
        }

        .search-wrap {
            flex: 1;
            position: relative;
            max-width: 360px;
        }
        .search-wrap input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text);
            transition: box-shadow 0.15s;
        }
        .search-wrap input:focus { box-shadow: 0 0 0 3px rgba(217, 160, 45, 0.18); }
        .search-wrap input::placeholder { color: var(--text-faint); }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
            pointer-events: none;
        }

        .topbar-actions { margin-left: auto; display: flex; gap: 10px; }

        .btn-primary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            color: var(--ink-deep);
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(217, 160, 45, 0.32);
            transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
        }
        .btn-primary:hover { box-shadow: 0 6px 18px rgba(217, 160, 45, 0.42); }
        .btn-primary:active { transform: scale(0.97); opacity: 0.92; }

        .btn-ghost {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            border: 1.5px solid transparent;
            transition: transform 0.1s, box-shadow 0.15s;
        }
        .btn-ghost:hover { box-shadow: 0 4px 12px rgba(45, 122, 184, 0.18); }
        .btn-ghost:active { transform: scale(0.97); }

        .content {
            padding: 24px 32px 40px;
        }

        /* ===== HEADERS ===== */
        .view-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 24px;
            gap: 16px;
        }

        .view-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .view-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .view-actions { display: flex; gap: 10px; }

        /* ===== ALBUMS GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px 18px;
        }

        .album-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--card), var(--card-hover));
            overflow: hidden;
            position: relative;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .album-card:hover .album-art { box-shadow: var(--shadow-lg); }
        .album-card:hover .album-art { transform: translateY(-3px); }

        .album-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .album-art.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-faint);
        }

        /* Default placeholder cover (when no embedded artwork) */
        .art-placeholder { display: block; width: 100%; height: 100%; }

        .play-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            color: var(--ink-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 6px 16px rgba(217, 160, 45, 0.38);
            z-index: 2;
        }
        .album-card:hover .play-overlay { opacity: 1; transform: translateY(0); }
        .play-overlay:active { transform: scale(0.92); }
        /* Touch devices have no real hover — the button was invisible at tap
           time, so taps landed on the card behind it. Always show on touch. */
        @media (hover: none) {
            .play-overlay { opacity: 1; transform: translateY(0); }
        }

        .album-name {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .album-artist {
            font-size: 12px;
            color: var(--text-dim);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* ===== TRACK LIST ===== */
        .track-list {
            display: flex;
            flex-direction: column;
        }

        .track-row {
            display: grid;
            grid-template-columns: 36px 1fr 1fr 80px 36px;
            gap: 16px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.12s;
            color: var(--text-dim);
        }
        .track-row:hover { background: var(--surface-2); color: var(--text); }
        .track-row.playing { color: var(--accent); }
        .track-row.playing .track-num::before { content: "▶"; color: var(--accent); }
        .track-row.playing .track-num span { display: none; }

        .track-num {
            text-align: center;
            font-size: 13px;
            color: var(--text-faint);
            font-variant-numeric: tabular-nums;
        }
        .track-row:hover .track-num span { display: none; }
        .track-row:hover .track-num::before { content: "▶"; color: var(--text); }

        .track-title {
            font-size: 14px;
            font-weight: 500;
            color: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-meta {
            font-size: 13px;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-time {
            font-size: 13px;
            color: var(--text-dim);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .track-menu {
            opacity: 0;
            color: var(--text-dim);
            font-size: 18px;
            padding: 4px;
            border-radius: 6px;
            transition: opacity 0.15s, background 0.15s;
        }
        .track-row:hover .track-menu { opacity: 1; }
        .track-menu:hover { background: var(--card-hover); color: var(--text); }

        .track-list-header {
            display: grid;
            grid-template-columns: 36px 1fr 1fr 80px 36px;
            gap: 16px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-faint);
            font-weight: 600;
        }
        .track-list-header > :nth-child(1) { text-align: center; }
        .track-list-header > :nth-child(4) { text-align: right; }

        /* ===== ALBUM DETAIL HERO ===== */
        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            padding: 0 16px 0 10px;
            margin-bottom: 18px;
            border-radius: 20px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: -0.1px;
            transition: transform 0.1s, box-shadow 0.15s;
            box-shadow: var(--shadow-sm);
        }
        .detail-back:hover { box-shadow: var(--shadow); }
        .detail-back:active { transform: scale(0.96); }

        .detail-hero {
            display: flex;
            gap: 28px;
            margin-bottom: 32px;
            align-items: flex-end;
        }

        .detail-art {
            width: 220px;
            height: 220px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: var(--shadow-lg);
            background: linear-gradient(135deg, var(--card), var(--card-hover));
        }
        .detail-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .detail-info { flex: 1; min-width: 0; }
        .detail-kind {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 8px;
        }
        .detail-name {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -1.2px;
            margin-bottom: 12px;
            line-height: 1.05;
        }
        .detail-author {
            font-size: 15px;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 6px;
        }
        .detail-stats {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 22px;
        }
        .detail-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        /* 3-way category picker (Songs / Album / Audiobook) sitting in the
           detail-hero action row. Inactive pills show the gradient border;
           the active one fills with the accent so the choice reads at a glance. */
        .cat-picker {
            display: inline-flex;
            gap: 0;
            padding: 3px;
            border-radius: 999px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .cat-pill {
            appearance: none;
            border: 0;
            background: transparent;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.1px;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.1s;
        }
        .cat-pill:hover { color: var(--text); }
        .cat-pill:active { transform: scale(0.96); }
        .cat-pill.active {
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            color: var(--ink-deep);
            box-shadow: 0 2px 8px rgba(217, 160, 45, 0.32);
        }

        .btn-play {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            color: var(--ink-deep);
            font-size: 14px;
            font-weight: 700;
            border-radius: 999px;
            box-shadow: 0 6px 18px rgba(217, 160, 45, 0.36);
            transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
        }
        .btn-play:hover { box-shadow: 0 8px 24px rgba(217, 160, 45, 0.46); }
        .btn-play:active { transform: scale(0.97); opacity: 0.92; }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid transparent;
            transition: color 0.15s, transform 0.1s;
        }
        .btn-icon:hover { color: var(--accent-dim); }
        .btn-icon:active { transform: scale(0.94); }
        .btn-icon.danger:hover { color: var(--danger); }

        /* ===== EMPTY STATE ===== */
        .empty {
            text-align: center;
            padding: 80px 20px 60px;
            color: var(--text-dim);
        }
        .empty-icon {
            font-size: 52px;
            margin-bottom: 18px;
            opacity: 0.5;
        }
        .empty-title {
            font-size: 19px;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .empty-text {
            font-size: 14px;
            line-height: 1.6;
            max-width: 340px;
            margin: 0 auto 24px;
        }

        /* ===== DROP ZONE OVERLAY ===== */
        .drop-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 251, 245, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }
        :root[data-theme="dark"] .drop-overlay { background: rgba(16, 52, 100, 0.92); }
        .drop-overlay.active { display: flex; }
        .drop-card {
            border: 2.5px dashed var(--accent);
            border-radius: 24px;
            padding: 60px 80px;
            text-align: center;
            color: var(--accent-dim);
            background: rgba(217, 160, 45, 0.08);
        }
        .drop-card .big {
            font-size: 60px;
            margin-bottom: 16px;
        }
        .drop-card .title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* ===== PLAYER BAR ===== */
        .player {
            grid-row: 2;
            grid-column: 1 / -1;
            background: var(--bg-deep);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            padding: 0 20px calc(0px + var(--safe-bottom));
            gap: 24px;
            z-index: 20;
        }

        .player-track {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
        }

        .player-art {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            background: var(--card);
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .player-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .player-meta { min-width: 0; flex: 1; }
        .player-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-artist {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .player-buttons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ctrl-btn {
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
            padding: 6px;
        }
        .ctrl-btn:hover { color: var(--text); }
        .ctrl-btn.active { color: var(--accent); }
        .ctrl-btn.dim { color: var(--text-faint); }
        .ctrl-btn.dim:hover { color: var(--text-dim); }

        .play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--text);
            color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.15s;
        }
        .play-btn:hover { transform: scale(1.06); box-shadow: 0 4px 14px rgba(26, 36, 51, 0.28); }
        .play-btn:active { transform: scale(0.95); }

        .scrub-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 540px;
        }

        .time {
            font-size: 11px;
            color: var(--text-dim);
            font-variant-numeric: tabular-nums;
            min-width: 38px;
            text-align: center;
        }

        .scrub {
            flex: 1;
            height: 4px;
            background: var(--card);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            overflow: visible;
        }
        .scrub-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-bright));
            border-radius: 2px;
            position: relative;
            transition: width 0.05s linear;
        }
        .scrub:hover .scrub-fill { background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }
        .scrub-knob {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform 0.15s;
        }
        .scrub:hover .scrub-knob { transform: translateY(-50%) scale(1); }

        .player-right {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .vol-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 120px;
        }
        .vol-bar {
            flex: 1;
            height: 4px;
            background: var(--card);
            border-radius: 2px;
            cursor: pointer;
        }
        .vol-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-bright));
            border-radius: 2px;
        }
        .vol-bar:hover .vol-fill { background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }

        .speed-btn {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            padding: 4px 8px;
            border-radius: 6px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            transition: color 0.15s;
            font-variant-numeric: tabular-nums;
        }
        .speed-btn:hover { color: var(--accent-dim); }
        .speed-btn.active { color: var(--accent-dim); }

        /* ===== MODAL ===== */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-bg.active { display: flex; }

        .modal {
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        .modal-input {
            width: 100%;
            padding: 12px 14px;
            background:
                linear-gradient(var(--bg), var(--bg)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 16px;
            transition: box-shadow 0.15s;
        }
        .modal-input:focus { box-shadow: 0 0 0 3px rgba(217, 160, 45, 0.22); }

        .modal-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 16px;
        }

        .modal-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
        }
        .modal-list-item:hover { background: var(--card); }
        .modal-list-item.picked { background: var(--accent-glow); }
        .modal-list-item .pick-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .modal-list-item .pick-text { flex: 1; min-width: 0; overflow: hidden; }
        .modal-list-item .pick-text > div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-list-item .pick-box {
            width: 20px; height: 20px; border-radius: 5px;
            border: 1.5px solid var(--border-strong);
            display: flex; align-items: center; justify-content: center;
            color: var(--bg-deep); background: var(--surface); flex-shrink: 0;
        }
        .modal-list-item.picked .pick-box { background: var(--accent); border-color: var(--accent); }
        .modal-list-item.picked .pick-box svg { display: block; }
        .modal-list-item .pick-box svg { display: none; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-text {
            padding: 9px 16px;
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
            border-radius: 10px;
            transition: color 0.15s, background 0.15s;
        }
        .btn-text:hover { color: var(--text); background: var(--surface-2); }
        .btn-text.danger:hover { color: var(--danger); }

        /* ===== CONTEXT MENU ===== */
        .ctx-menu {
            position: fixed;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 10px;
            padding: 6px;
            min-width: 180px;
            z-index: 200;
            box-shadow: var(--shadow-lg);
            display: none;
        }
        .ctx-menu.active { display: block; }
        .ctx-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            transition: background 0.1s;
        }
        .ctx-item:hover { background: var(--card-hover); }
        .ctx-item.danger { color: var(--danger); }
        .ctx-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 6px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: calc(var(--player-h) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            color: var(--text);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: var(--shadow);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== NOW PLAYING (FULL) ===== */
        .now-playing-full {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at top, rgba(217, 160, 45, 0.10), transparent 60%),
                var(--bg);
            z-index: 50;
            display: flex;
            flex-direction: column;
            padding: calc(20px + var(--safe-top)) 24px calc(20px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .now-playing-full.active { transform: translateY(0); }

        .np-close {
            align-self: flex-start;
            height: 40px;
            padding: 0 16px 0 12px;
            border-radius: 22px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
            transition: transform 0.1s;
        }
        .np-close:active { transform: scale(0.96); }
        .np-close .np-close-label { letter-spacing: -0.2px; }

        .np-art {
            width: min(380px, 78vw);
            aspect-ratio: 1;
            margin: 0 auto 32px;
            border-radius: 16px;
            overflow: hidden;
            background: var(--card);
            box-shadow: var(--shadow-lg);
        }
        .np-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .np-info { text-align: center; margin-bottom: 28px; }
        .np-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .np-artist { font-size: 15px; color: var(--text-dim); }

        .np-scrub-row {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 420px;
            margin: 0 auto 28px;
            width: 100%;
        }

        .np-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-bottom: 28px;
        }

        .np-play {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--text);
            color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.15s;
        }
        .np-play:hover { box-shadow: 0 6px 20px rgba(26, 36, 51, 0.32); }
        .np-play:active { transform: scale(0.95); }

        /* Seek-15 buttons (in player + NP) */
        .seek-btn { color: var(--text); }
        .seek-btn:active { transform: scale(0.92); }
        .np-seek { color: var(--text); padding: 4px; }
        .np-side { color: var(--text-dim); }
        .np-side:hover { color: var(--text); }

        .np-extras {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: auto;
            flex-wrap: wrap;
        }

        /* ===== SCROLLBARS ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--card-hover); }

        /* ===== HIDDEN ===== */
        [hidden] { display: none !important; }
        .file-input { display: none; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 880px) {
            :root { --player-h: 144px; }
            .app {
                grid-template-columns: 1fr;
            }
            .main { grid-column: 1; grid-row: 1; }
            .player { grid-column: 1; grid-row: 2; }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                z-index: 60;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.open { transform: translateX(0); box-shadow: 16px 0 48px rgba(80, 50, 30, 0.18); }
            .menu-btn { display: flex; }
            .topbar { padding: calc(12px + var(--safe-top)) 14px 12px; gap: 10px; }
            .topbar-actions { margin-left: 0; }
            .content { padding: 20px 16px 32px; }
            .detail-hero { flex-direction: column; align-items: flex-start; gap: 18px; }
            .detail-art { width: 180px; height: 180px; }
            .detail-name { font-size: 28px; letter-spacing: -0.7px; }
            .view-title { font-size: 24px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 14px; }
            .track-row { grid-template-columns: 28px 1fr 32px; gap: 10px; padding: 12px 6px; }
            .track-list-header { grid-template-columns: 28px 1fr 32px; gap: 10px; padding: 8px 6px; }
            .track-list-header > :nth-child(3), .track-list-header > :nth-child(4),
            .track-row > :nth-child(3), .track-row > :nth-child(4) { display: none; }
            .track-menu { opacity: 1; padding: 6px 4px; }
            .player {
                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;
                padding: 10px 12px calc(20px + var(--safe-bottom));
                gap: 8px 12px;
                align-items: center;
            }
            .player-track { grid-column: 1; grid-row: 1; min-width: 0; }
            .player-art { width: 46px; height: 46px; }
            .player-title { font-size: 13px; }
            .player-artist { font-size: 11px; }
            .player-right { grid-column: 2; grid-row: 1; gap: 6px; }
            .player-controls { grid-column: 1 / -1; grid-row: 2; flex-direction: column-reverse; }
            .player-buttons { gap: 12px; }
            .player-buttons .ctrl-btn { padding: 4px; }
            .player-buttons .hide-narrow { display: none; }
            .play-btn { width: 36px; height: 36px; }
            .scrub-row { max-width: none; gap: 8px; }
            .time { min-width: 34px; font-size: 10px; }
            .vol-row { display: none; }
            .player-right .ctrl-btn { padding: 6px; }
            .speed-btn { padding: 4px 7px; font-size: 11px; }

            /* Hide "Add Music" label on narrow screens */
            .btn-primary .btn-label { display: none; }
            .btn-primary { padding: 9px 12px; }
        }

        @media (max-width: 480px) {
            :root { --player-h: 136px; }
            .topbar { padding: calc(10px + var(--safe-top)) 12px 10px; gap: 8px; }
            .content { padding: 16px 14px 28px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 18px 12px; }
            .detail-art { width: 160px; height: 160px; }
            .detail-name { font-size: 24px; }
            .player-buttons { gap: 10px; }
            .play-btn { width: 34px; height: 34px; }
            .player-right { gap: 4px; }
            .np-controls { gap: 22px; }
            .np-art { width: min(280px, 72vw); }
            .np-title { font-size: 20px; }
        }

        /* Very narrow phones — hide speed button to save space, accessible from Now Playing */
        @media (max-width: 360px) {
            .player-right .speed-btn { display: none; }
        }

        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 55;
            display: none;
        }
        .sidebar-backdrop.active { display: block; }

        @media (min-width: 881px) { .sidebar-backdrop { display: none !important; } }

        /* ===== ADDED: gold diamond pattern background, Home feed, etc. ===== */
        .main {
            background-image:
                linear-gradient(180deg, rgba(255, 251, 245, 0.96) 0%, var(--bg) 320px),
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M14 0l14 14-14 14L0 14z' fill='none' stroke='%23D9A02D' stroke-opacity='0.10' stroke-width='0.7'/></svg>");
            background-attachment: scroll, fixed;
            background-repeat: no-repeat, repeat;
            background-color: var(--bg);
        }
        :root[data-theme="dark"] .main {
            background-image:
                linear-gradient(180deg, rgba(36, 85, 153, 0.88) 0%, var(--bg) 320px),
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><path d='M14 0l14 14-14 14L0 14z' fill='none' stroke='%23FFCC44' stroke-opacity='0.12' stroke-width='0.7'/></svg>");
        }

        /* Home view */
        .home-hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 8px 0 18px;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }
        .home-hero-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .home-hero-title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.7px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .home-hero-sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
        }
        .home-section { margin: 22px 0 4px; }
        .home-section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }
        .home-section-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .home-section-link {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .home-section-link:hover { color: var(--accent-dim); background: var(--surface-2); }

        .home-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px 14px;
        }
        .home-row-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }
        .home-row-scroll::-webkit-scrollbar { height: 8px; }
        .home-row-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        .home-row-scroll .home-card { flex: 0 0 142px; }
        .home-card-narrow { flex: 0 0 142px; }
        .home-card .album-art { box-shadow: 0 8px 22px rgba(0,0,0,0.35); }

        /* Make the topbar lighter so content lands closer to the top */
        .content { padding-top: 14px; }


        .play-btn .icon-pause, .np-play .icon-pause { display: none; }
        .play-btn.is-playing .icon-play, .np-play.is-playing .icon-play { display: none; }
        .play-btn.is-playing .icon-pause, .np-play.is-playing .icon-pause { display: block; }

        /* Yellow artwork play/pause overlay: hide the pause icon by default;
           when the current track belongs to this album, swap to pause + keep
           the button visible without needing hover. */
        .play-overlay .icon-pause { display: none; }
        .play-overlay.is-playing .icon-play { display: none; }
        .play-overlay.is-playing .icon-pause { display: block; }
        .play-overlay.is-playing { opacity: 1; transform: translateY(0); }
        @keyframes hifi-play-pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .play-overlay.pop { animation: hifi-play-pop 0.32s ease-out; }
        .play-overlay { transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s; }
        .play-overlay.is-playing { box-shadow: 0 8px 22px rgba(217, 160, 45, 0.55); }

        /* Build version pill (bottom-right, very low key) */
        .build-pill {
            position: fixed;
            right: 8px;
            bottom: calc(8px + var(--safe-bottom));
            z-index: 200;
            font: 10px/1 -apple-system, monospace;
            color: var(--text-dim);
            background: rgba(255, 251, 245, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 4px 7px;
            border-radius: 6px;
            border: 1px solid var(--border-strong);
            opacity: 0.75;
            pointer-events: none;
            font-variant-numeric: tabular-nums;
        }
        :root[data-theme="dark"] .build-pill { background: rgba(26, 67, 128, 0.85); }

        /* Theme toggle button — sits in the topbar */
        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .theme-toggle:active { transform: scale(0.94); }
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* "New version available — tap to reload" banner */
        .update-banner {
            position: fixed;
            left: 50%;
            bottom: calc(var(--player-h) + 12px + var(--safe-bottom));
            transform: translateX(-50%);
            z-index: 220;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--accent-bright), var(--accent));
            color: var(--ink-deep);
            font-size: 13px;
            font-weight: 700;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(217, 160, 45, 0.45);
            cursor: pointer;
        }
        .update-banner.show { display: inline-flex; }


        .fmt-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--surface-2);
            color: var(--text-dim);
            margin-left: 6px;
            border: 1px solid var(--border);
            vertical-align: 1px;
        }
        .fmt-badge.warn { background: rgba(199, 92, 92, 0.18); color: var(--danger); border-color: rgba(199, 92, 92, 0.3); }
        .fmt-badge.bm { background: rgba(201, 169, 97, 0.15); color: var(--accent); border-color: rgba(201, 169, 97, 0.3); cursor: pointer; }
        .fmt-badge.bm:hover { background: rgba(201, 169, 97, 0.28); }
        .track-row.unsupported { opacity: 0.7; }

        /* Speed picker */
        .speed-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0 4px;
        }
        .speed-pick {
            padding: 12px 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 9px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .speed-pick:hover { transform: translateY(-1px); }
        .speed-pick.active { background: linear-gradient(135deg, var(--accent-bright), var(--accent)); color: var(--ink-deep); border-color: var(--accent-bright); }

        /* EQ modal */
        .eq-toggle { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; font-size: 14px; color: var(--text-dim); }
        .eq-toggle input { width: 16px; height: 16px; }
        .eq-row {
            display: grid;
            grid-template-columns: 60px 1fr 56px;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
            font-size: 13px;
            color: var(--text-dim);
        }
        .eq-row input[type=range] { width: 100%; accent-color: var(--accent); }
        .eq-val { text-align: right; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
        .eq-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
        .eq-presets .ctx-item {
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .eq-presets .ctx-item:hover { transform: translateY(-1px); }

        /* A-B button */
        .ab-btn {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            min-width: 44px;
            padding: 0 8px;
            color: var(--text-dim);
        }
        .ab-btn.active { color: var(--accent); background: var(--accent-glow); }

        /* Bookmarks modal */
        .bm-list { max-height: 320px; overflow-y: auto; margin: 6px 0 10px; }
        .bm-row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
        .bm-jump {
            flex: 1;
            text-align: left;
            padding: 9px 12px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            font-variant-numeric: tabular-nums;
            transition: transform 0.1s;
        }
        .bm-jump:hover { transform: translateY(-1px); }
        .bm-del {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
        }
        .bm-del:hover { color: var(--danger); }

        /* Loading ring on play button */
        .play-btn.loading::before {
            content: "";
            position: absolute;
            inset: -3px;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .play-btn { position: relative; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Now-playing chapter list */
        .np-chapters {
            width: min(560px, 92vw);
            margin: 18px auto 8px;
            padding: 14px 16px 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            max-height: 36vh;
            overflow-y: auto;
        }

        /* ===== KARAOKE LYRICS ===== */
        .np-lyrics {
            width: min(620px, 94vw);
            margin: 18px auto 8px;
            padding: 20px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-height: 44vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            text-align: center;
            line-height: 1.55;
        }
        .np-lyrics-empty {
            color: var(--text-faint);
            font-size: 13px;
            padding: 12px 0;
        }
        .np-lyric-line {
            font-size: 17px;
            color: var(--text-faint);
            padding: 6px 4px;
            transition: color 0.2s, transform 0.2s, font-weight 0.2s;
        }
        .np-lyric-line.is-current {
            color: var(--accent);
            font-weight: 700;
            font-size: 19px;
            transform: scale(1.02);
        }
        .np-lyric-line.is-past { color: var(--text-dim); }

        /* Lyrics toggle in np-extras gets the accent treatment when on */
        .ctrl-btn.lyrics-on { color: var(--accent); background: var(--accent-glow); }
        .np-chapters-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-faint);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .np-chapters-list { display: flex; flex-direction: column; gap: 2px; }
        .np-chapter {
            display: grid;
            grid-template-columns: 28px 1fr auto;
            gap: 10px;
            align-items: center;
            text-align: left;
            padding: 9px 10px;
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
        }
        .np-chapter:hover { background: var(--card-hover); color: var(--text); }
        .np-chapter.playing { background: var(--accent-glow); color: var(--accent); }
        .np-chapter-num { font-variant-numeric: tabular-nums; color: var(--text-faint); font-weight: 600; }
        .np-chapter-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .np-chapter-time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-faint); }
        /* ===== THE SHELF (everything that lives on the mini) ===== */
        .shelf-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
        .shelf-chip {
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, color 0.12s, background 0.12s;
        }
        .shelf-chip:active { transform: scale(0.96); }
        .shelf-chip.on {
            color: var(--ink-deep);
            background:
                linear-gradient(var(--accent-glow), var(--accent-glow)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
        }
        .shelf-list { display: flex; flex-direction: column; gap: 2px; }
        .shelf-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            align-items: center;
            padding: 11px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .shelf-row:hover { background: var(--surface-2); }
        .shelf-row.playing .shelf-name { color: var(--accent); }
        .shelf-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
        /* The at-a-glance "it's on the phone" mark, like VidQ's. */
        .shelf-tick {
            flex: none; width: 22px; height: 22px; border-radius: 50%;
            display: grid; place-items: center;
            font-size: 12px; font-weight: 800; color: var(--surface);
            border: 1.5px dashed var(--line);
        }
        .shelf-row.have .shelf-tick {
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
        }
        .shelf-on { font-weight: 700; color: var(--accent-dim); }
        /* A series: a little stack of cards, tapped open. */
        .shelf-stack { flex: none; position: relative; width: 22px; height: 24px; }
        .shelf-stack i {
            position: absolute; width: 17px; height: 19px; border-radius: 4px;
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
        }
        .shelf-stack i:nth-child(1) { left: 5px; top: 0; opacity: 0.45; }
        .shelf-stack i:nth-child(2) { left: 2.5px; top: 2.5px; opacity: 0.75; }
        .shelf-stack i:nth-child(3) { left: 0; top: 5px; }
        .shelf-row.have .shelf-stack i:nth-child(3) {
            background: linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
        }
        .shelf-group .shelf-name { font-weight: 700; }
        .shelf-chev { font-size: 22px; color: var(--text-dim); padding: 0 6px; }
        .shelf-back {
            font-size: 13px; font-weight: 700; color: var(--accent-dim);
            padding: 4px 0; margin-bottom: 4px;
        }
        .shelf-dl.resume { color: var(--accent-dim); }
        .shelf-row.playing .shelf-name::before { content: "▶ "; }
        .shelf-name { font-size: 14px; font-weight: 500; color: var(--text); }
        .shelf-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .shelf-actions { display: flex; align-items: center; gap: 8px; }
        .shelf-dl {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            min-width: 84px;
            justify-content: center;
            color: var(--text);
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            transition: transform 0.1s;
        }
        .shelf-dl:active { transform: scale(0.96); }
        .shelf-dl.have {
            color: var(--ink-deep);
            background:
                linear-gradient(var(--accent-glow), var(--accent-glow)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
        }
        .shelf-dl.working { color: var(--text-dim); }
        .shelf-menu {
            width: 30px; height: 30px;
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 15px;
            line-height: 1;
        }
        .shelf-menu:hover { background: var(--card-hover); color: var(--text); }
        /* Two buttons plus a title don't fit a phone in one row — let the
           actions drop to their own line instead of the label wrapping. */
        .shelf-header { flex-wrap: wrap; gap: 12px; }
        .shelf-header .view-actions button { white-space: nowrap; }
        .shelf-connect {
            max-width: 460px;
            margin: 8px auto;
            padding: 26px;
            border-radius: 16px;
            text-align: center;
            background:
                linear-gradient(var(--card), var(--card)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            box-shadow: var(--shadow-sm);
        }
        .shelf-connect .modal-input { text-align: center; letter-spacing: 4px; font-size: 20px; }
        .shelf-note { font-size: 12.5px; color: var(--text-dim); margin-top: 14px; line-height: 1.5; }
        .shelf-addr {
            width: 100%; margin-top: 10px; padding: 9px 12px;
            border: 1px solid var(--line); border-radius: 8px;
            background: var(--surface); color: var(--text-dim);
            font-size: 12px; text-align: center;
        }
        @media (max-width: 700px) {
            .shelf-row { padding: 12px 6px; }
            .shelf-dl { min-width: 76px; }
        }

        /* ===== BOOK PROGRESS: continue listening + finished ticks ===== */
        .book-bar {
            position: absolute; left: 8px; right: 8px; bottom: 8px; height: 5px;
            border-radius: 999px; background: rgba(255, 255, 255, 0.55);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18); overflow: hidden; z-index: 1;
        }
        .book-bar i {
            display: block; height: 100%; border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-blue));
        }
        .album-card:has(.book-bar) .play-overlay { bottom: 20px; }
        .done-tick {
            position: absolute; top: 8px; left: 8px; z-index: 2;
            width: 28px; height: 28px; border-radius: 50%;
            display: grid; place-items: center;
            font-size: 14px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-blue));
            border: 2px solid var(--surface);
            box-shadow: 0 3px 10px rgba(31, 90, 142, 0.35);
        }
        .book-left { font-size: 12px; color: var(--accent-dim); font-weight: 700; }
        .detail-progress { margin-top: 10px; max-width: 320px; }
        .detail-progress .book-bar { position: static; height: 6px; background: var(--line); box-shadow: none; }
        .detail-progress .book-left { display: block; margin-top: 6px; }
        .pill-toggle {
            padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
            color: var(--text-dim);
            background:
                linear-gradient(var(--surface), var(--surface)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .pill-toggle:active { transform: scale(0.94); }
        .pill-toggle.on {
            color: var(--ink-deep);
            background:
                linear-gradient(var(--accent-glow), var(--accent-glow)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
        }
        .np-boost { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; }
        .np-boost.active { color: var(--ink-deep); background: var(--accent-glow); }
        .np-boost[disabled] { opacity: 0.4; }

        /* ===== SHELF COVERS ===== */
        .shelf-cover {
            flex: none; position: relative; width: 44px; height: 44px; border-radius: 8px;
            overflow: hidden; box-shadow: var(--shadow-sm); background: var(--card);
        }
        .shelf-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .shelf-cover .shelf-tick {
            position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; font-size: 10px;
            border: 2px solid var(--surface);
        }
        .shelf-row:not(.have) .shelf-cover .shelf-tick { display: none; }

        /* ===== CAR SCREEN — four huge targets, readable at a glance ===== */
        .car {
            position: fixed; inset: 0; z-index: 400; display: none;
            flex-direction: column; gap: 18px;
            padding: calc(var(--safe-top) + 16px) 20px calc(var(--safe-bottom) + 20px);
            background: var(--bg);
        }
        .car.active { display: flex; }
        .car-top { display: flex; align-items: center; gap: 14px; }
        .car-art { width: 72px; height: 72px; border-radius: 12px; overflow: hidden; flex: none; box-shadow: var(--shadow); }
        .car-art img, .car-art svg { width: 100%; height: 100%; object-fit: cover; display: block; }
        .car-title { font-size: 20px; font-weight: 800; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .car-chapter { font-size: 15px; color: var(--text-dim); margin-top: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .car-close {
            margin-left: auto; flex: none; width: 56px; height: 56px; border-radius: 16px; font-size: 26px; font-weight: 800;
            color: var(--text);
            background: linear-gradient(var(--surface), var(--surface)) padding-box,
                        linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 2px solid transparent;
        }
        .car-time { text-align: center; font-size: 17px; font-weight: 700; color: var(--accent-dim); }
        .car-time b { display: block; font-size: 44px; color: var(--text); letter-spacing: -1px; }
        .car-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.4fr 1fr; gap: 14px; min-height: 0; }
        .car-btn {
            border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            font-size: 17px; font-weight: 800; color: var(--text);
            background: linear-gradient(var(--card), var(--card)) padding-box,
                        linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 2.5px solid transparent; box-shadow: var(--shadow);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .car-btn:active { transform: scale(0.95); }
        .car-btn svg { width: 54px; height: 54px; }
        .car-btn.play {
            grid-column: 1 / -1;
            color: var(--ink-deep);
            background: linear-gradient(135deg, var(--accent-bright), var(--accent)) padding-box,
                        linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
        }
        .car-btn.play svg { width: 96px; height: 96px; }
        .car-btn.play .icon-pause { display: none; }
        .car-btn.play.is-playing .icon-pause { display: block; }
        .car-btn.play.is-playing .icon-play { display: none; }
        @media (orientation: landscape) and (max-height: 500px) {
            .car-grid { grid-template-columns: 1fr 1.6fr 1fr; grid-template-rows: 1fr; }
            .car-btn.play { grid-column: auto; order: 2; }
            .car-btn.back { order: 1; } .car-btn.fwd { order: 3; }
            .car-time b { font-size: 32px; }
        }

        /* ===== ON THIS DEVICE (storage) + putting things back ===== */
        .dev-card {
            margin: 0 0 16px; padding: 18px 20px; border-radius: 16px;
            background:
                linear-gradient(var(--card), var(--card)) padding-box,
                linear-gradient(135deg, var(--accent), var(--accent-blue)) border-box;
            border: 1.5px solid transparent;
            box-shadow: var(--shadow-sm);
        }
        .dev-card h3 { font-size: 15px; font-weight: 800; margin: 0 0 4px; }
        .dev-card p { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.5; }
        .dev-card .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
        .dev-meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
        .dev-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-blue)); }
        .dev-ok { color: var(--accent-blue-deep); font-weight: 700; }
        .dev-warn { color: var(--danger); font-weight: 700; }
        .dev-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
        .dev-row {
            display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
            padding: 11px 12px; border-radius: 10px;
        }
        .dev-row:hover { background: var(--surface-2); }
        .dev-row .name { font-size: 14px; font-weight: 600; }
        .dev-row .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .dev-row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .dev-h { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-dim); margin: 22px 0 8px; }
        .restore-card { margin-bottom: 20px; }

    </style>
</head>
<body>

<div class="app">
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark"></div>
            <div class="brand-name">Hifi</div>
        </div>

        <div class="nav-section">
            <div class="nav-label">Library</div>
            <div class="nav-item active" data-view="home">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
                <span class="label">Home</span>
            </div>
            <div class="nav-item" data-view="albums">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="label">Albums</span>
                <span class="count" id="albums-count"></span>
            </div>
            <div class="nav-item" data-view="songs">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span class="label">Songs</span>
